[package]
name = "blip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The game engine. A build script that only generates pictures and sounds
# turns it off and builds without macroquad.
default = ["engine"]
engine = ["dep:macroquad"]

[dependencies]
blip_font = { workspace = true }
macroquad = { workspace = true, optional = true }
png = { workspace = true }
