[workspace]
resolver = "2"
members = [
    "crates/blip",
    "crates/serpent",
    "crates/bouncer",
    "crates/brawler",
    "crates/bubbler",
    "crates/defender",
    "crates/rally",
    "crates/meteors",
    "crates/raider",
    "crates/adder",
    "crates/warlock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
macroquad = { version = "0.4", features = ["audio"] }
png = "0.17"
blip = { path = "crates/blip" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# blip synthesises the games' music on the device at load: speed there
# is worth more than the bytes "z" saves.
[profile.release.package.blip]
opt-level = 3
