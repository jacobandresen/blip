<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script src="../howler.min.js"></script>
  <script src="../kiosk.js?v=10"></script>
  <link rel="stylesheet" href="../kiosk.css?v=13">
  <link rel="stylesheet" href="../shell.css?v=16">
</head>
<body>

  <div id="loader">
    <div id="status">LOADING</div>
    <div id="bar-outer"><div id="bar-inner"></div></div>
  </div>

  <div id="topbar" class="kiosk-bar">
    <span id="coins-hud" class="kiosk-btn kiosk-btn-inert" data-coins-hud></span>
    <a id="back" class="kiosk-btn" href="../index.html">&#8592; GAMES</a>
    <button id="insert-coin-btn" class="kiosk-btn">&#x25BA; INSERT COIN</button>
  </div>

  <div id="need-coin-overlay">
    <div class="nco-msg">&#x25BA; INSERT COIN &#x25C4;</div>
  </div>

  <!-- Arcade stick + buttons: an on-screen Atari-style control, always
       shown — draggable by touch/mouse (shell.js), and its ball/buttons
       animate to reflect keyboard and gamepad input too. #fire-buttons is
       populated by shell.js from BLIP_GAMES (one or two buttons). -->
  <div id="touch-pad">
    <div id="stick-base">
      <div id="stick-gate"></div>
      <div id="stick-handle">
        <div id="stick-shaft"></div>
        <div id="stick-ball"></div>
      </div>
    </div>
    <div id="fire-buttons"></div>
  </div>

  <!-- Paddle dials: rally only, touch only. P1=left, P2=right -->
  <div id="paddle-dial">
    <div id="dial-hand"></div>
    <div id="dial-label">P1</div>
  </div>
  <div id="paddle-dial-p2">
    <div id="dial-hand-p2"></div>
    <div id="dial-label-p2">2P</div>
  </div>

  <!-- #marquee-bar (per-game backlit name sign) is injected by shell.js -->
  <div id="arcade-bezel"></div>
  <span class="bezel-screw tl"></span>
  <span class="bezel-screw tr"></span>
  <span class="bezel-screw bl"></span>
  <span class="bezel-screw br"></span>
  <canvas id="glcanvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

  <script src="../shell.js?v=23"></script>
  <script src="../mq_js_bundle.js?v=1"></script>
  <script src="../howler_audio_plugin.js"></script>
  <script src="../blip_bridge.js?v=7"></script>
  <script>load("index.wasm");</script>

</body>
</html>
