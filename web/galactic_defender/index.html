<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script src="../howler.min.js"></script>
  <script src="../kiosk.js?v=24"></script>
  <link rel="stylesheet" href="../kiosk.css?v=59">
  <link rel="stylesheet" href="../shell.css?v=50">
</head>
<body>

  <a class="blip-logo" href="../index.html">BLIP<span class="ba-rest">&nbsp;ARCADE</span></a>

  <!-- Coin slot: fixed in the top-right corner of the cabinet's top panel,
       mirroring the BLIP ARCADE logo at top-left — the physical slot you
       feed, up on the panel, not down on the control deck. -->
  <button id="insert-coin-btn" class="kiosk-btn"><span data-coins-hud></span></button>

  <div id="loader">
    <div id="status">LOADING</div>
    <div id="bar-outer"><div id="bar-inner"></div></div>
  </div>

  <!-- The fixed bar is a plain (untransformed) box; .deck-panel is the
       3D-tilted control surface inside it. Keeping the tilt off the
       position:fixed element is what stops iOS Safari clipping the bar's
       lower edge / floating it off the bottom in a home-screen PWA. -->
  <div id="topbar" class="kiosk-bar">
   <div class="deck-panel">
    <!-- One control station per player. Station two is hidden until the
         game says it has a second player (blip_set_mode -> data-players),
         so a one-player cabinet still looks like a one-player cabinet.
         Arcade stick: mounted flush in the bar — its ball rides a shaft
         that rises up over the game above the bar. Always shown, not just
         on touch devices — draggable by touch/mouse (shell.js), and it
         animates to reflect keyboard and gamepad input too, so it doubles
         as a live input readout. The fire buttons beside it are built by
         shell.js from BLIP_GAMES (one to four caps). -->
    <div class="deck-side" id="deck-p1">
     <span class="deck-tag">1P</span>
     <div class="stick-base" id="stick-base">
       <div class="stick-boot"></div>
       <div class="stick-handle">
         <div class="stick-shaft"></div>
         <div class="stick-ball"></div>
       </div>
     </div>
     <div class="fire-buttons" id="fire-buttons"></div>
    </div>
    <!-- Station two is built exactly like station one, not mirrored:
         stick on the left, buttons on the right. A player's hands do
         not swap over because they are sitting on the other side of a
         cabinet, and the two decks have to be the same deck. -->
    <div class="deck-side" id="deck-p2">
     <span class="deck-tag" data-second>2P</span>
     <div class="stick-base" id="stick-base-p2">
       <div class="stick-boot"></div>
       <div class="stick-handle">
         <div class="stick-shaft"></div>
         <div class="stick-ball"></div>
       </div>
     </div>
     <div class="fire-buttons" id="fire-buttons-p2"></div>
    </div>
    <!-- Paddle dials: rally only. Mounted in the deck like the stick —
         two spinner knobs on the tilted panel, P1 left / P2 right.
         shell.js reveals them and wires the touch spin. -->
    <div id="paddle-dial">
      <div class="dial-cap"><div id="dial-hand"></div></div>
      <div id="dial-label">P1</div>
    </div>
    <div id="paddle-dial-p2">
      <div class="dial-cap"><div id="dial-hand-p2"></div></div>
      <div id="dial-label-p2">2P</div>
    </div>
   <!-- The game pad, inside .deck-panel so it shares the joystick
        deck's coordinate system: same tilt, same origin, so switching
        controller moves nothing under the thumb. Cross on the left,
        caps on the right. -->
   <div class="snes-pad" id="snes-pad" aria-hidden="true">
    <span class="snes-cord" aria-hidden="true"></span>
    <div class="snes-shell">
      <div class="snes-dpad">
        <span class="snes-dp-seg dp-up"    data-blip="up"    data-blip-nopress></span>
        <span class="snes-dp-seg dp-right" data-blip="right" data-blip-nopress></span>
        <span class="snes-dp-seg dp-down"  data-blip="down"  data-blip-nopress></span>
        <span class="snes-dp-seg dp-left"  data-blip="left"  data-blip-nopress></span>
        <span class="snes-dp-hub"></span>
      </div>
      <div class="snes-face">
        <button type="button" class="snes-btn snes-b" data-blip="button1" aria-label="Button B"><span></span></button>
        <button type="button" class="snes-btn snes-a" data-blip="button1" aria-label="Button A"><span></span></button>
      </div>
      <span class="snes-wordmark" aria-hidden="true">BLIP</span>
      <span class="deck-tag">1P</span>
    </div>
   </div>
   <div class="snes-pad second" id="snes-pad-p2" aria-hidden="true">
    <div class="snes-shell">
      <div class="snes-dpad">
        <span class="snes-dp-seg dp-up"    data-blip="p2up"    data-blip-nopress></span>
        <span class="snes-dp-seg dp-right" data-blip="p2right" data-blip-nopress></span>
        <span class="snes-dp-seg dp-down"  data-blip="p2down"  data-blip-nopress></span>
        <span class="snes-dp-seg dp-left"  data-blip="p2left"  data-blip-nopress></span>
        <span class="snes-dp-hub"></span>
      </div>
      <div class="snes-face"></div>
      <span class="deck-tag" data-second>2P</span>
    </div>
   </div>
   </div>

  </div>

  <!-- Subtle: flip the deck back to the classic arcade joystick. -->
  <button type="button" id="control-toggle" aria-label="Switch on-screen controller">&#9654;&nbsp;<span class="ct-what"></span></button>

  <div id="need-coin-overlay">
    <div class="nco-panel">
      <div class="nco-msg">INSERT COIN</div>
      <div class="nco-sub">1 Coin  1 Play</div>
      <div class="nco-credit">Credit&#160;&#160;0</div>
    </div>
  </div>

  <!-- #marquee-bar (per-game backlit name sign) is injected by shell.js -->
  <div id="arcade-bezel"></div>
  <span class="bezel-screw tl"></span>
  <span class="bezel-screw tr"></span>
  <span class="bezel-screw bl"></span>
  <span class="bezel-screw br"></span>
  <canvas id="glcanvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

  <script src="../blip_controller.js?v=5"></script>
  <script src="../vendor/supabase.js?v=1"></script>
  <script src="../blip_config.js?v=1"></script>
  <script src="../blip_scores.js?v=4"></script>
  <script src="../shell.js?v=51"></script>
  <script src="../mq_js_bundle.js?v=1"></script>
  <script src="../howler_audio_plugin.js"></script>
  <script src="../blip_bridge.js?v=11"></script>
  <script>load("index.wasm");</script>

</body>
</html>
