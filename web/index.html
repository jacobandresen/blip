<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="kiosk.css?v=76">
  <!-- Before first paint (kiosk.js loads at the end): a touch screen gets
       no deck on this page, so it must never flash up. -->
  <script>
    if (('ontouchstart' in window) || navigator.maxTouchPoints > 0)
      document.documentElement.setAttribute('data-has-touch', '');
    // Likewise a kiosk in fullscreen (kiosk.js) has no deck.
    try {
      if (localStorage.getItem('blip-fullscreen') === '1')
        document.documentElement.setAttribute('data-fullscreen', '');
    } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #32c832;
      --cyan:    #00c8c8;
      --magenta: #c832c8;
      --red:     #dc3232;
      --blue:    #3264dc;
      --yellow:  #e6dc32;
    }

    html, body { height: 100%; }
    /* Kill rubber-band overscroll so the fixed bottom bar can't appear to
       peel off the bottom edge during a bounce on iOS. */
    html { overflow-x: hidden; overscroll-behavior: none; }

    body {
      background: #050508;
      color: #ccc;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px));
      overscroll-behavior: none;
    }

    /* CRT overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 99;
    }

    /* vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 98;
    }

    /* ---- header ---- */
    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      /* Just enough padding to clear the fixed top bar; the rest goes to the
         game grid. */
      padding: calc(48px + env(safe-area-inset-top, 0px)) 0 12px;
      position: relative;
    }

    /* marquee bulb strip — the illuminated sign at the top of a real cabinet */
    header::before {
      content: '';
      position: absolute;
      top: 22px;
      left: 10%;
      right: 10%;
      height: 6px;
      background-image: radial-gradient(circle, var(--yellow) 0 2.2px, transparent 2.6px);
      background-size: 26px 6px;
      background-repeat: repeat-x;
      background-position: center;
      filter: drop-shadow(0 0 5px var(--yellow));
      animation: marquee-bulbs 1.6s steps(2, jump-none) infinite;
    }
    @keyframes marquee-bulbs {
      50% { filter: drop-shadow(0 0 2px var(--yellow)); opacity: .5; }
    }
    @media (max-width: 520px) {
      header::before { left: 4%; right: 4%; }
    }

    /* The top bar, logo and coin-slot heights and the corner badges live in
       kiosk.css, shared with the info pages. */


    .divider {
      width: 100%;
      max-width: 900px;
      height: 1px;
      background: linear-gradient(to right, transparent, #222, transparent);
      margin: 0 auto 24px;
    }

    /* ---- screen bezel — frames the game grid like a monitor set into the
       cabinet, complete with corner screws and a glass glare ---- */
    .screen-bezel {
      position: relative;
      width: 100%;
      max-width: 948px;
      margin: 0 auto 40px;
      padding: 26px 22px 30px;
      border-radius: 18px;
      background: linear-gradient(155deg, #29292d 0%, #17171a 40%, #0b0b0d 100%);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.6),
        0 0 0 6px #050506,
        0 0 0 7px rgba(255,255,255,0.03);
    }
    .screen-bezel::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      box-shadow: inset 0 0 26px rgba(0,0,0,0.85), inset 0 2px 0 rgba(255,255,255,0.04);
      pointer-events: none;
    }
    .screen-bezel::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      background: linear-gradient(115deg,
        rgba(255,255,255,0.05) 0%, transparent 16%,
        transparent 82%, rgba(255,255,255,0.03) 100%);
      pointer-events: none;
    }
    .screen-bezel .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #6c6c70, #101012 72%);
      box-shadow: 0 1px 1px rgba(255,255,255,0.15), 0 1px 2px rgba(0,0,0,0.8);
    }
    .screen-bezel .screw::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 1px;
      background: #000;
      transform: translate(-50%, -50%) rotate(35deg);
    }
    .screen-bezel .screw.tl { top: 9px; left: 9px; }
    .screen-bezel .screw.tr { top: 9px; right: 9px; }
    .screen-bezel .screw.bl { bottom: 9px; left: 9px; }
    .screen-bezel .screw.br { bottom: 9px; right: 9px; }
    @media (max-width: 520px) {
      .screen-bezel { padding: 20px 14px 24px; border-radius: 14px; }
    }

    /* ---- game grid ---- */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }
    /* Wide screens: four across, so the eight games fill two rows. */
    @media (min-width: 1300px) {
      .game-grid { grid-template-columns: repeat(4, 1fr); max-width: 1200px; }
    }

    /* ---- card ---- */
    .card {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-decoration: none;
      color: inherit;
      border: 1px solid #1e1e1e;
      padding: 28px 24px 24px;
      background: #0a0a0c;
      position: relative;
      overflow: hidden;
      transition: transform .15s, box-shadow .2s, border-color .2s, opacity .3s, filter .3s;
      cursor: pointer;
    }

    .card:hover, .card-focused { transform: translateY(-3px); }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
    }
    .card::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .card::after  { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    .card-serpent    { --c: var(--green);   }
    .card-bouncer    { --c: var(--cyan);    }
    .card-galactic   { --c: var(--magenta); }
    .card-rally      { --c: var(--red);     }
    .card-meteors    { --c: #b4b4b4;        }
    .card-sky-raider { --c: var(--blue);    }
    .card-brawler    { --c: #dc3c28;        }
    .card-bubbler    { --c: #78d2ff;        }

    /* ---- keyboard-recommended chip ---- */
    .badge-kb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #7a7a7a;
      border: 1px solid #2c2c2c;
      padding: 3px 10px 3px 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.02);
    }

    .card::before, .card::after { border-color: var(--c); }

    .card:hover {
      border-color: var(--c);
      box-shadow:
        0 0 16px rgba(0,0,0,.8),
        0 0 30px color-mix(in srgb, var(--c) 20%, transparent),
        inset 0 0 20px color-mix(in srgb, var(--c) 4%, transparent);
    }

    /* Out of credits the card's corner brackets go dark and it does not light
       on hover; the focused / playing card keeps its glow. */
    .card.no-credit:not(.card-focused):not(.card-active)::before,
    .card.no-credit:not(.card-focused):not(.card-active)::after {
      border-color: #333;
    }
    .card.no-credit:not(.card-focused):not(.card-active):hover {
      transform: none;
      border-color: #1e1e1e;
      box-shadow: none;
    }

    /* Full glow on the selected card (.card-focused) and the game last played
       (.card-active), in its own accent, breathing, even with no credits. */
    .card.card-focused,
    .card.card-active {
      border-color: var(--c);
      animation: card-active-glow 2.6s ease-in-out infinite;
    }
    .card.card-focused.no-credit,
    .card.card-active.no-credit { opacity: 1; filter: none; }
    @keyframes card-active-glow {
      0%, 100% {
        box-shadow:
          0 0 16px rgba(0,0,0,.8),
          0 0 18px color-mix(in srgb, var(--c) 45%, transparent),
          0 0 46px color-mix(in srgb, var(--c) 26%, transparent),
          inset 0 0 20px color-mix(in srgb, var(--c) 8%, transparent);
      }
      50% {
        box-shadow:
          0 0 16px rgba(0,0,0,.8),
          0 0 30px color-mix(in srgb, var(--c) 80%, transparent),
          0 0 78px color-mix(in srgb, var(--c) 48%, transparent),
          inset 0 0 30px color-mix(in srgb, var(--c) 15%, transparent);
      }
    }

    /* screenshot */
    .card-shot-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 480 / 540;
      margin-bottom: 16px;
      padding: 6px;
      border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--c) 15%, transparent);
      background: #000;
    }

    .card-shot {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
    }

    /* Meteors is anti-aliased vector line art, not pixel-art sprites —
       nearest-neighbor scaling turns its smooth lines into jagged noise
       at thumbnail size, so give it a normal smooth downscale instead. */
    .card-meteors .card-shot {
      image-rendering: auto;
    }

    /* Brawler's card is a fight poster (brawler_card.sh), not one frame: it
       fills the frame, leans its title like a marquee, and a light sweeps
       across it while the card is lit. */
    .card-brawler .card-shot-wrap { overflow: hidden; }
    .card-brawler .card-shot { object-fit: cover; transition: transform .4s ease-out; }
    .card-brawler:hover .card-shot,
    .card-brawler.card-focused .card-shot { transform: scale(1.05); }
    .card-brawler .card-shot-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.22) 50%, transparent 58%);
      transform: translateX(-120%);
      pointer-events: none;
    }
    .card-brawler:hover .card-shot-wrap::after,
    .card-brawler.card-focused .card-shot-wrap::after,
    .card-brawler.card-active .card-shot-wrap::after { animation: brawler-shine 3.2s ease-in-out infinite; }
    @keyframes brawler-shine {
      0%, 55% { transform: translateX(-120%); }
      100%    { transform: translateX(120%); }
    }
    .card-brawler .card-title {
      font-style: italic;
      letter-spacing: .26em;
      background: linear-gradient(180deg, #ffe45c 20%, #ff7a2a 55%, #dc3c28 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 70%, transparent));
    }

    .card-title {
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: .2em;
      font-weight: 900;
      color: var(--c);
      text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: left;
      width: 100%;
    }

    /* Card copy sits on the tube: the same phosphor glow as the titles,
       dimmer. */
    .card-genre, .card-desc, .card-controls {
      text-shadow: 0 0 5px currentColor;
    }

    .card-genre {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #6e8c30;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: left;
    }

    /* The record to beat, when one is known (set by the script below). */
    .card-hi {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--yellow);
      text-shadow: 0 0 6px color-mix(in srgb, var(--yellow) 60%, transparent);
      margin: -8px 0 14px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.75;
      color: #6e8c30;
      text-align: left;
      letter-spacing: .04em;
      margin-bottom: 24px;
      flex: 1;
    }

    .card-controls {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #6e8c30;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: left;
    }

    /* No credits: cards dimmed and desaturated like an unpowered cabinet but
       still legible; a click nudges toward the coin slot. */
    .card.no-credit {
      opacity: 0.55;
      filter: grayscale(60%) brightness(0.62);
    }
    /* Pressing a dark card while broke: it drops almost out entirely for a
       beat — a dead, unlit "nothing happens here, put a coin in" thunk —
       then eases back to its resting dim. */
    .card.rejected { animation: card-reject 0.55s ease-out; }
    @keyframes card-reject {
      0%   { opacity: 0.55; filter: grayscale(60%) brightness(0.62); }
      22%  { opacity: 0.05; filter: grayscale(90%) brightness(0.28); transform: scale(0.97); }
      100% { opacity: 0.55; filter: grayscale(60%) brightness(0.62); }
    }

    @media (max-width: 520px) {
      .card        { padding-left: 40px; }
    }

    /* ---- 2-player seal ---- */
    /* All of a card's badges, stacked down from the top-right corner: each
       one tucks a few pixels under the one before and paints over it, so
       however many there are, every one stays readable. */
    .card-badges {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
    }
    .card-badges > * { position: relative; flex: none; }
    .card-badges > * + * { margin-top: -7px; }
    .card-badges > :nth-child(2) { z-index: 2; margin-right: 4px; }
    .card-badges > :nth-child(3) { z-index: 3; }
    .card-badges > :nth-child(4) { z-index: 4; margin-right: 4px; }

    .badge-2p {
      width: 52px;
      height: 52px;
      border: 2px solid var(--yellow);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--yellow);
      text-shadow: 0 0 6px var(--yellow);
      box-shadow:
        0 0 0 3px rgba(0,0,0,0.85),
        0 0 0 5px color-mix(in srgb, var(--yellow) 35%, transparent),
        0 0 14px color-mix(in srgb, var(--yellow) 35%, transparent);
      transform: rotate(12deg);
      text-align: center;
      line-height: 1.3;
      background: rgba(0,0,0,0.85);
      z-index: 1;
    }

    /* Genre stickers, slapped on at a tilt.
       ACTION: a hot slanted sticker with a quick flash now and then.
       COSY: a soft pastel pill with a heart, floating gently. */
    .badge-genre {
      font-weight: 900;
      text-align: center;
      white-space: nowrap;
    }
    .badge-action {
      padding: 7px 12px 6px 14px;
      font-size: 11px;
      font-style: italic;
      letter-spacing: 1.5px;
      color: #fff8d6;
      background: linear-gradient(135deg, #ff3b1f 0%, #ff7a1a 55%, #ffb21a 100%);
      clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
      transform: rotate(-9deg) skewX(-8deg);
      text-shadow: 1px 1px 0 #7a1200, -1px 0 0 #7a1200, 0 -1px 0 #7a1200, 0 0 6px rgba(255, 220, 120, 0.8);
      filter: drop-shadow(0 0 0 #ffe066) drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.85))
              drop-shadow(0 0 8px rgba(255, 110, 40, 0.55));
      animation: action-flash 3.2s ease-in-out infinite;
    }
    /* the same sticker slapped on the other way round on Raider */
    .card-sky-raider .badge-action { transform: rotate(8deg) skewX(-8deg); }
    @keyframes action-flash {
      0%, 86%, 100% { filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.85)) drop-shadow(0 0 8px rgba(255, 110, 40, 0.55)); }
      90% { filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(255, 240, 160, 1)) brightness(1.35); }
    }
    .badge-cosy {
      padding: 6px 12px 6px 10px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #7a2e55;
      background: linear-gradient(180deg, #ffe6f0 0%, #ffcfe3 100%);
      border: 2px solid #fff4f9;
      border-radius: 999px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55), 0 0 12px rgba(255, 180, 215, 0.55);
      transform: rotate(-6deg);
      animation: cosy-float 3.6s ease-in-out infinite;
    }
    .badge-cosy::before {
      content: '\2665';
      margin-right: 5px;
      color: #ff6fa8;
      text-shadow: 0 0 4px rgba(255, 140, 190, 0.8);
    }
    @keyframes cosy-float {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50%      { transform: rotate(-4deg) translateY(-3px); }
    }
    /* TRIPPY: a melting blob of swirling rainbow, its colours cycling, the
       letters printed slightly out of register. */
    .badge-trippy {
      padding: 6px 13px 6px 11px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #fff;
      background: conic-gradient(from 30deg, #ff3cac, #ffd23f, #3cff9e, #2bd2ff, #a64bff, #ff3cac);
      border: 2px solid #fff6fd;
      border-radius: 42% 58% 55% 45% / 55% 45% 58% 42%;
      text-shadow: -1.5px 0 #ff00c8, 1.5px 0 #00e5ff, 0 0 6px rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.55), 0 0 14px rgba(190, 80, 255, 0.65);
      transform: rotate(7deg);
      animation: trippy-hue 4s linear infinite, trippy-melt 3s ease-in-out infinite;
    }
    /* a hypnotic pinwheel, spinning */
    .badge-trippy::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      vertical-align: -1px;
      border-radius: 50%;
      background: repeating-conic-gradient(#1a0030 0 22.5deg, #fff 22.5deg 45deg);
      box-shadow: 0 0 0 1px #fff;
      animation: trippy-spin 1.6s linear infinite;
    }
    @keyframes trippy-hue { to { filter: hue-rotate(360deg); } }
    @keyframes trippy-spin { to { transform: rotate(360deg); } }
    @keyframes trippy-melt {
      0%, 100% { border-radius: 42% 58% 55% 45% / 55% 45% 58% 42%; transform: rotate(7deg) scale(1, 1); }
      33%      { border-radius: 58% 42% 40% 60% / 45% 60% 40% 55%; transform: rotate(4deg) scale(1.05, 0.96); }
      66%      { border-radius: 50% 50% 62% 38% / 60% 40% 55% 45%; transform: rotate(10deg) scale(0.97, 1.04); }
    }
    /* TOUCH: a quiet tablet mark in the card's lower-right corner, a
       fingertip tapping its screen. */
    .badge-touch {
      position: absolute;
      right: 12px;
      bottom: 9px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #6e737a;
      pointer-events: none;
      transition: color .2s;
    }
    .card:hover .badge-touch, .card-focused .badge-touch { color: #b8bec6; }

    /* CONTROLLER: a real gamepad is recommended. A DualSense in the same
       quiet corner as the TOUCH mark; its light bar comes on with the card. */
    .badge-pad {
      position: absolute;
      right: 12px;
      bottom: 8px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #6e737a;
      pointer-events: none;
      transition: color .2s;
    }
    .card:hover .badge-pad, .card-focused .badge-pad { color: #b8bec6; }
    .bp-text {
      display: flex;
      flex-direction: column;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1px;
      line-height: 1.15;
    }
    .bp-text small { font-size: 7px; font-weight: 500; letter-spacing: 0.8px; opacity: 0.75; }
    .bp-dualsense { width: 27px; height: 17px; overflow: visible; }
    .bp-body { fill: currentColor; opacity: 0.55; }
    .bp-centre { fill: #0a0a0c; stroke: currentColor; stroke-width: 0.5; }
    .bp-light { fill: none; stroke: #4f8bff; stroke-width: 1.2; stroke-linecap: round; opacity: 0.5; transition: opacity .2s; }
    .card:hover .bp-light, .card-focused .bp-light { opacity: 1; filter: drop-shadow(0 0 1.5px #5b8cff); }
    .bp-stick { fill: #0a0a0c; stroke: currentColor; stroke-width: 0.6; }
    .bp-dpad { stroke: #0a0a0c; stroke-width: 0.9; stroke-linecap: round; }
    .bp-btn { fill: #0a0a0c; }
    /* Only where TOUCH can be picked (kiosk.js sets data-has-touch). */
    :root:not([data-has-touch]) .badge-touch { display: none; }
    .bt-ipad { width: 12px; height: 15px; overflow: visible; }
    .bt-ipad rect { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .bt-tip { fill: currentColor; }
    .bt-ring {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      opacity: 0;
      transform-origin: 8px 10px;
      animation: bt-ripple 2.8s ease-out infinite;
    }
    @keyframes bt-ripple {
      0%, 60% { opacity: 0; transform: scale(0.4); }
      64%     { opacity: 0.9; transform: scale(0.5); }
      100%    { opacity: 0; transform: scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .badge-action, .badge-cosy, .badge-trippy, .badge-trippy::before, .bt-ring { animation: none; }
      .card-brawler .card-shot-wrap::after { animation: none !important; }
      .card-brawler .card-shot { transition: none; transform: none !important; }
    }

    /* ---- footer ---- */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: #2a2a2a;
      text-transform: uppercase;
      line-height: 2;
    }

    /* ---- cabinet side rails — the cabinet's side art, only shown once the
       viewport is wide enough that they won't crowd the actual content ---- */
    .cab-rail {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 64px;
      display: none;
      pointer-events: none;
      z-index: 4;
      background:
        radial-gradient(circle at 50% 0, #c8c8ce 0 2.4px, rgba(200,200,206,0.15) 3px, transparent 4px)
          0 44px / 100% 150px repeat-y,
        repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 5px),
        linear-gradient(90deg, #3c3c42, #232326 55%, #131315);
    }
    /* bright seam where the rail meets the screen — sells it as a distinct panel */
    .cab-rail::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18) 15%, rgba(255,255,255,0.18) 85%, transparent);
    }
    .cab-rail.left  { left: 0; box-shadow: inset -14px 0 28px rgba(0,0,0,0.75); }
    .cab-rail.left::after  { right: 0; }
    .cab-rail.right { right: 0; box-shadow: inset 14px 0 28px rgba(0,0,0,0.75); transform: scaleX(-1); }
    .cab-rail.right::after { right: 0; }
    @media (min-width: 1180px) {
      .cab-rail { display: block; }
    }

    /* ---- stars ---- */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 1px;
      height: 1px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d) var(--delay) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: var(--lo); }
      to   { opacity: var(--hi); }
    }

    header, .divider, .game-grid, footer { position: relative; z-index: 1; }

    @keyframes konami-shake {
      0%,100% { transform: translate(0,0); }
      10%     { transform: translate(-10px,-6px); }
      20%     { transform: translate(10px,6px); }
      30%     { transform: translate(-8px,4px); }
      40%     { transform: translate(8px,-4px); }
      50%     { transform: translate(-6px,6px); }
      60%     { transform: translate(6px,-6px); }
      70%     { transform: translate(-4px,3px); }
      80%     { transform: translate(4px,-3px); }
      90%     { transform: translate(-2px,2px); }
    }
    body.konami-shake { animation: konami-shake 0.55s ease; }

    /* A touch screen picks a game by tapping its card: no control deck here,
       and the corner clusters come down to the screen's edge. */
    :root[data-has-touch] #kiosk-bar { display: none; }
    :root[data-has-touch] body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    /* Fullscreen on a PC: the keyboard picks the game, so the deck goes too. */
    :root[data-fullscreen] #kiosk-bar { display: none; }
    :root[data-fullscreen] body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    /* A kiosk's wide screen shows the whole catalogue at once: eight across. */
    @media (min-width: 1700px) {
      /* 800px is about the row's height: this sits it mid-screen. */
      :root[data-fullscreen] .screen-bezel { max-width: calc(100vw - 170px); margin-top: max(0px, calc((100vh - 800px) / 2 - 40px)); }
      :root[data-fullscreen] .game-grid { grid-template-columns: repeat(8, 1fr); max-width: none; gap: 16px; }
    }


  </style>
</head>

    /* ------------------------------------------------------------------ */
    /* Language application                                                 */
    /* ------------------------------------------------------------------ */
    function applyLang(lang) {
      var t = i18n[lang];
      if (!t) return;

      // A touch screen gets the touch version of a hint where there is one.
      var touch = document.documentElement.hasAttribute('data-has-touch');
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        var text = touch && t[key + 'Touch'] !== undefined ? t[key + 'Touch'] : t[key];
        if (text !== undefined) el.innerHTML = text;
      });

      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });

      document.documentElement.lang = lang;
      try { localStorage.setItem('blip-lang', lang); } catch(e) {}
    }

    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentLang = this.getAttribute('data-lang');
        applyLang(currentLang);
      });
    });

    /* load saved language, fall back to browser preference, then English */
    var currentLang = 'en';
    (function() {
      var saved = null;
      try { saved = localStorage.getItem('blip-lang'); } catch(e) {}
      var browserLang = (navigator.language || '').slice(0, 2).toLowerCase();
      currentLang = saved || (i18n[browserLang] ? browserLang : 'en');
      applyLang(currentLang);
    })();

    /* ------------------------------------------------------------------ */
    /* Coin / credits                                                       */
    /* ------------------------------------------------------------------ */
    // ---- Ambient hum ----
    // A cabinet's transformer hum once there is a credit in the machine;
    // silent while broke. Needs a user gesture (autoplay), so it arms on the
    // first interaction and starts once coins > 0; the coin click itself
    // counts (onCoinInserted calls tryStartHum).
    var tryStartHum = (function () {
      var started = false;
      function startHum() {
        started = true;
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.removeEventListener(ev, tryStartHumImpl);
        });
        var ctx = getKioskAudio();

        // Power-supply drone: a 58 Hz saw through a low-pass plus a 120 Hz
        // overtone, at the threshold of notice, fading up over a couple of
        // seconds.
        var osc = ctx.createOscillator();
        var osc2 = ctx.createOscillator();
        var lpf = ctx.createBiquadFilter();
        var gMaster = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 58;
        osc2.type = 'sine';
        osc2.frequency.value = 120;
        lpf.type = 'lowpass';
        lpf.frequency.value = 520;
        lpf.Q.value = 1.4;
        gMaster.gain.value = 0;
        var g2 = ctx.createGain();
        g2.gain.value = 0.32;
        osc.connect(lpf);
        osc2.connect(g2); g2.connect(lpf);
        lpf.connect(gMaster); gMaster.connect(blipOut(ctx));
        osc.start();
        osc2.start();
        gMaster.gain.linearRampToValueAtTime(0.055, ctx.currentTime + 2);

        scheduleGlitch(ctx);
      }

      function scheduleGlitch(ctx) {
        setTimeout(function () {
          playAtariGlitch(ctx);
          scheduleGlitch(ctx);
        }, 12000 + Math.random() * 22000);
      }

      function playAtariGlitch(ctx) {
        var t   = ctx.currentTime;
        var dur = 0.03 + Math.random() * 0.09;
        var len = Math.ceil(ctx.sampleRate * dur);
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d   = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = ctx.createBufferSource();
        var bpf = ctx.createBiquadFilter();
        var g   = ctx.createGain();
        src.buffer = buf;
        bpf.type = 'bandpass';
        bpf.frequency.value = 150 + Math.random() * 500;
        bpf.Q.value = 1;
        src.connect(bpf); bpf.connect(g); g.connect(blipOut(ctx));
        g.gain.setValueAtTime(0.014 + Math.random() * 0.012, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.start(t); src.stop(t + dur + 0.01);
      }

      function tryStartHumImpl() {
        if (started || getCoins() <= 0) return;
        startHum();
      }

      ['click', 'touchstart', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, tryStartHumImpl, { passive: true });
      });

      return tryStartHumImpl;
    }());

    // ---- Startup chime ----
    // Once, when the machine gets its first coin (0 -> 1): a relay thunk and
    // a rising flyback whine settling on the hum's 58 Hz. The cards light
    // when it finishes, a beat of booting between paying and playing.
    function playStartupSound(onDone) {
      var ctx = getKioskAudio();
      var t = ctx.currentTime;

      var noiseBuf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.14), ctx.sampleRate);
      var noiseData = noiseBuf.getChannelData(0);
      for (var i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
      var noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      var noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'lowpass';
      noiseFilter.frequency.setValueAtTime(2200, t);
      noiseFilter.frequency.exponentialRampToValueAtTime(80, t + 0.14);
      var noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.5, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(blipOut(ctx));
      noise.start(t); noise.stop(t + 0.16);

      var osc  = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(60, t + 0.06);
      osc.frequency.exponentialRampToValueAtTime(920, t + 0.4);
      osc.frequency.exponentialRampToValueAtTime(58, t + 0.9);
      gain.gain.setValueAtTime(0.0001, t + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.2, t + 0.32);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
      osc.connect(gain); gain.connect(blipOut(ctx));
      osc.start(t + 0.06); osc.stop(t + 0.96);

      if (typeof onDone === 'function') setTimeout(onDone, 900);
    }

    window.onCoinInserted = function() {
      // The corner button stops flashing the instant the coin lands — that's
      // the payoff for inserting it. The cards still wait for the power-up.
      updateCoinLock();
      if (getCoins() === 1) {
        // This coin just brought the machine from empty to funded — power
        // up first, light up the cards once that finishes.
        playStartupSound(function () {
          updateCardDimming();
        });
        tryStartHum();
      } else {
        updateCardDimming();
      }
    };

    // No credits: every card reads as unlit (still fully visible — just a
    // light dim + desaturate) instead of a separate "NEED COIN" label —
    // same gate as the card click itself, shown on the cards directly.
    function updateCardDimming() {
      var enabled = getCoins() > 0;
      document.querySelectorAll('.card').forEach(function(card) {
        card.classList.toggle('no-credit', !enabled);
      });
      updateCoinLock();
    }

    // No INSERT COIN overlay here: the grid stays visible, dimmed, and the
    // flashing COINS button is the cue (mirrored onto <body>). Game pages
    // still show the overlay on a deep link with no credit.
    function updateCoinLock() {
      document.body.classList.toggle('need-coin', getCoins() <= 0);
    }

    function updateCreditsDisplay() {
      updateCoinsHud();
      updateCardDimming();
      if (typeof updateCoinBeckon === 'function') updateCoinBeckon();
    }

    updateCreditsDisplay(); // initialise dimming to match coins on page load

    // Opens the card's game. Needs a credit but does not spend it: the credit
    // rides along to the game page (same sessionStorage), and the game
    // charges it when play starts. Broke: a nudge.
    function attemptStart(card) {
      if (getCoins() <= 0) {
        nudgeInsertCoin();
        card.classList.remove('rejected');
        void card.offsetWidth;
        card.classList.add('rejected');
        card.addEventListener('animationend', function () {
          card.classList.remove('rejected');
        }, { once: true });
        return;
      }
      try { sessionStorage.setItem('blip-last-game', (card.getAttribute('href') || '').split('/')[0]); } catch (e) {}
      window.location.href = card.href;
    }

    /* Light up the card of the game you're currently in (last started). */
    (function () {
      try {
        var last = sessionStorage.getItem('blip-last-game');
        if (!last) return;
        var el = document.querySelector('.card[href^="' + last + '/"]');
        if (el) el.classList.add('card-active');
      } catch (e) {}
    }());

    // Points a broke player at the COINS button in the top-right corner
    // instead of leaving the dimmed-card press feeling dead: a quick swell
    // + flicker on the button (see .coin-nudge).
    function nudgeInsertCoin() {
      ['kiosk-insert-btn'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('coin-nudge');
        void el.offsetWidth;
        el.classList.add('coin-nudge');
        el.addEventListener('animationend', function () {
          el.classList.remove('coin-nudge');
        }, { once: true });
      });
    }

    document.querySelectorAll('.card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        e.preventDefault();
        attemptStart(card);
      });
    });

    document.getElementById('kiosk-insert-btn').addEventListener('click', insertCoin);

    // ---- The record on each card ---- "HI 12,340 NAME": the leaderboard's
    // top as a game page last cached it (or this browser's own best), then
    // every game's current top in one request where the backend is set up.
    (function () {
      function show(slug, top) {
        var card = document.querySelector('.card[href^="' + slug + '/"]');
        if (!card || !top || !(top.score > 0)) return;
        var el = card.querySelector('.card-hi');
        if (!el) {
          el = document.createElement('div');
          el.className = 'card-hi';
          card.insertBefore(el, card.querySelector('.card-desc'));
        }
        el.textContent = 'HI ' + Number(top.score).toLocaleString('en-US') +
          (top.handle ? ' ' + String(top.handle).toUpperCase() : '');
      }
      function cached(slug) {
        try {
          var t = JSON.parse(localStorage.getItem('blip-top-' + slug) || 'null');
          if (t && t.score > 0) return t;
          var best = parseInt(localStorage.getItem('blip-best-' + slug) || '0', 10);
          return best > 0 ? { score: best, handle: localStorage.getItem('blip-handle') || '' } : null;
        } catch (e) { return null; }
      }
      Object.keys(BLIP_GAMES).forEach(function (slug) { show(slug, cached(slug)); });
      var cfg = window.BLIP_SUPABASE;
      if (!cfg || !cfg.url || !cfg.anonKey || !window.fetch) return;
      fetch(cfg.url + '/rest/v1/leaderboard_top?select=game,handle,score&rank=eq.1',
            { headers: { apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (rows) {
          rows.forEach(function (row) {
            var top = { handle: row.handle || '', score: row.score | 0 };
            try { localStorage.setItem('blip-top-' + row.game, JSON.stringify(top)); } catch (e) {}
            show(row.game, top);
          });
        })
        .catch(function () {});
    }());

    // ---- Card navigation: keyboard arrows + joystick/gamepad ----
    (function () {
      var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
      if (!cards.length) return;
      // Start the selection on the game you're currently in (last started),
      // so the first arrow press steps away from there.
      var lastGame = null;
      try { lastGame = sessionStorage.getItem('blip-last-game'); } catch (e) {}
      var activeIdx = lastGame ? cards.findIndex(function (c) {
        return (c.getAttribute('href') || '').indexOf(lastGame + '/') === 0;
      }) : -1;
      var idx = activeIdx >= 0 ? activeIdx : 0;
      var navActive = false;

      function highlight() {
        cards.forEach(function (c, i) {
          c.classList.toggle('card-focused', navActive && i === idx);
          // Once you're navigating, the focus glow is the only glow —
          // hand it over from the "last played" card.
          if (navActive) c.classList.remove('card-active');
        });
      }

      function move(delta) {
        navActive = true;
        idx = (idx + delta + cards.length) % cards.length;
        highlight();
        cards[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }

      // Up and down go to the card above or below. In a single row or a
      // single column they are next and previous, like left and right.
      function columns() {
        var top = cards[0].getBoundingClientRect().top, n = 0;
        while (n < cards.length && Math.abs(cards[n].getBoundingClientRect().top - top) < 2) n++;
        return n;
      }
      function moveRow(dir) {
        var cols = columns(), n = cards.length;
        if (cols <= 1 || cols >= n) { move(dir); return; }
        var col = idx % cols, last = Math.floor((n - 1) / cols) * cols;
        var to = idx + dir * cols;
        // Off the bottom: the short last row's end first, then round to the top.
        if (to >= n) to = idx < last ? n - 1 : col;
        if (to < 0) to = last + col < n ? last + col : last + col - cols;
        move(to - idx);
      }

      // A kiosk left alone (fullscreen, 20 s without input) walks the
      // selection through the games; after 90 s it opens the lit one to show
      // its title screen (shell.js brings it back). Any input stops it.
      var lastInput = Date.now();
      function poke() { lastInput = Date.now(); }
      ['keydown', 'pointerdown', 'pointermove', 'wheel', 'touchstart'].forEach(function (ev) {
        window.addEventListener(ev, poke, { capture: true, passive: true });
      });
      setInterval(function () {
        if (!document.documentElement.hasAttribute('data-fullscreen') || document.hidden) return;
        var idle = Date.now() - lastInput;
        if (idle >= 90000) {
          var href = cards[idx].getAttribute('href') || '';
          try {
            sessionStorage.setItem('blip-attract', '1');
            // so the walk carries on from here when it comes back
            sessionStorage.setItem('blip-last-game', href.split('/')[0]);
          } catch (e) {}
          window.location.href = href;
        } else if (idle >= 20000) {
          move(1);
        }
      }, 5000);

      function activate() {
        // Fire always starts the selected game — default to the first card
        // if the player hasn't moved the selection yet, and auto-insert a
        // coin if needed rather than silently doing nothing.
        if (!navActive) { navActive = true; highlight(); }
        if (getCoins() <= 0) insertCoin();
        cards[idx].click();
      }

      document.addEventListener('keydown', function (e) {
        switch (e.code) {
          case 'ArrowRight': move(1);     e.preventDefault(); break;
          case 'ArrowLeft':  move(-1);    e.preventDefault(); break;
          case 'ArrowDown':  moveRow(1);  e.preventDefault(); break;
          case 'ArrowUp':    moveRow(-1); e.preventDefault(); break;
          case 'Space': case 'Enter': activate(); e.preventDefault(); break;
        }
      });

      pollGamepad(
        function (code) {
          poke();
          if (code === 'ArrowRight') move(1);
          else if (code === 'ArrowLeft') move(-1);
          else if (code === 'ArrowDown') moveRow(1);
          else if (code === 'ArrowUp') moveRow(-1);
          else if (code === 'Space') activate();
        },
        function () {}
      );

      // ---- The landing page's stick and caps drive the selection ---- The
      // stick steps through the games (auto-repeating while held), fire opens
      // the lit one; the lean uses the deck's --dx / --dy like a game page.
      (function () {
        var bar  = document.getElementById('kiosk-bar');
        var base = document.getElementById('stick-base');
        var fire = document.getElementById('fire-buttons');
        if (bar && base) {
          var ENGAGE = 15, RELEASE = 8, MAX_LEAN = 34;
          var pivot = null, activeId = null, dir = 0, repeatT = null;

          function lean(x, y) {
            base.style.setProperty('--dx', Math.max(-1, Math.min(1, x / MAX_LEAN)));
            base.style.setProperty('--dy', Math.max(-1, Math.min(1, y / MAX_LEAN)));
          }
          function setDir(d) {
            if (d === dir) return;
            dir = d;
            clearTimeout(repeatT);
            if (d !== 0) {
              move(d);
              repeatT = setTimeout(function tick() {
                move(dir);
                repeatT = setTimeout(tick, 150);
              }, 340);
            }
          }
          function apply(e) {
            var dx = e.clientX - pivot.x, dy = e.clientY - pivot.y;
            var along = Math.abs(dy) >= Math.abs(dx) ? dy : dx; // whichever axis is pushed harder
            var mag = Math.abs(along);
            var engaged = dir !== 0 ? mag > RELEASE : mag > ENGAGE;
            setDir(engaged ? (along < 0 ? -1 : 1) : 0);
            lean(dx, dy);
          }
          function release() {
            activeId = null; pivot = null;
            setDir(0); lean(0, 0);
            window.removeEventListener('pointermove', onMove, true);
            window.removeEventListener('pointerup', release, true);
            window.removeEventListener('pointercancel', release, true);
          }
          function onMove(e) {
            if (e.pointerId === activeId && pivot) { e.preventDefault(); apply(e); }
          }
          bar.addEventListener('pointerdown', function (e) {
            if (blipControls() !== 'stick') return;   // pad mode — deck shows the SNES pad
            // Stick half only — the right half is the fire buttons.
            if (fire && e.target.closest && e.target.closest('#fire-buttons')) return;
            if (fire) {
              var r = fire.getBoundingClientRect();
              if (r.width && e.clientX >= r.left - 6) return;
            }
            if (activeId !== null) release();
            e.preventDefault();
            activeId = e.pointerId;
            pivot = { x: e.clientX, y: e.clientY };
            window.addEventListener('pointermove', onMove, true);
            window.addEventListener('pointerup', release, true);
            window.addEventListener('pointercancel', release, true);
          });
          window.addEventListener('blur', release);
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) release();
          });
        }

        if (fire) {
          fire.querySelectorAll('.arcade-btn').forEach(function (btn) {
            btn.addEventListener('pointerdown', function (e) {
              e.preventDefault();
              btn.classList.add('active');
              activate();
            });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
              btn.addEventListener(ev, function () { btn.classList.remove('active'); });
            });
          });
        }
      }());

      // ---- The SNES pad drives the same selection, through BlipController.
      // d-pad steps the cards (with key-style auto-repeat while held);
      // A / B open the lit card. ----
      (function () {
        var pad = document.getElementById('snes-pad');
        if (!pad || typeof BlipController === 'undefined') return;

        var navDir = 0, repeatT = null;
        function navHold(d) {
          if (d === navDir) return;
          navDir = d;
          clearTimeout(repeatT);
          if (d !== 0) {
            move(d);
            repeatT = setTimeout(function tick() {
              move(navDir);
              repeatT = setTimeout(tick, 150);
            }, 340);
          }
        }

        BlipController.init({
          buttons: [{ key: ' ', code: 'Space' }],
          onInput: function (name, down) {
            if (name === 'up' || name === 'left')  { navHold(down ? -1 : 0); return; }
            if (name === 'down' || name === 'right') { navHold(down ? 1 : 0); return; }
            if ((name === 'button1' || name === 'button2') && down) activate();
          }
        });
        BlipController.bindButtons(pad);
        BlipController.bindDpad(pad.querySelector('.snes-dpad'));
        BlipController.registerVisual(pad);
      }());
    }());

    document.addEventListener('keydown', function(e) {
      if (e.key === '5' || e.key === 'c' || e.key === 'C') insertCoin();
      konamiCheck(e.key);
    });

    var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    var konamiIdx = 0;
    function konamiCheck(key) {
      konamiIdx = (key === KONAMI[konamiIdx]) ? konamiIdx + 1 : (key === KONAMI[0] ? 1 : 0);
      if (konamiIdx === KONAMI.length) {
        konamiIdx = 0;
        konamiActivate();
      }
    }
    function konamiActivate() {
      var n = getCoins();
      var added = Math.min(5, MAX_COINS - n);
      saveCoins(Math.min(n + 5, MAX_COINS));
      updateCoinsHud();
      for (var i = 0; i < added; i++) {
        setTimeout(playCoinInsert, i * 90);
      }
      document.body.classList.remove('konami-shake');
      void document.body.offsetWidth;
      document.body.classList.add('konami-shake');
      document.body.addEventListener('animationend', function() {
        document.body.classList.remove('konami-shake');
      }, { once: true });
    }

    /* ------------------------------------------------------------------ */
    /* Starfield                                                            */
    /* ------------------------------------------------------------------ */
    var stars = document.getElementById('stars');
    for (var i = 0; i < 120; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = [
        'left:'    + (Math.random() * 100) + '%',
        'top:'     + (Math.random() * 100) + '%',
        '--d:'     + (2 + Math.random() * 4).toFixed(1) + 's',
        '--delay:' + (Math.random() * 4).toFixed(1) + 's',
        '--lo:'    + (0.05 + Math.random() * 0.1).toFixed(2),
        '--hi:'    + (0.3  + Math.random() * 0.5).toFixed(2),
      ].join(';');
      stars.appendChild(s);
    }
  </script>
</body>
</html>
