<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="kiosk.css?v=28">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #32c832;
      --cyan:    #00c8c8;
      --magenta: #c832c8;
      --red:     #dc3232;
      --blue:    #3264dc;
      --yellow:  #e6dc32;
    }

    html, body { height: 100%; }
    /* Kill rubber-band overscroll so the fixed bottom bar can't appear to
       peel off the bottom edge during a bounce on iOS. */
    html { overflow-x: hidden; overscroll-behavior: none; }

    body {
      background: #050508;
      color: #ccc;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px));
      overscroll-behavior: none;
    }

    /* CRT overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 99;
    }

    /* vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 98;
    }

    /* ---- header ---- */
    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      /* Empty now that the marquee/subtitle text is gone (moved/removed —
         see .top-marquee-bar) — just enough padding to clear the fixed bar
         above, not the old headroom a 3-line banner needed. Freed space
         goes to pulling the game grid up, per an explicit request to use
         the top of the page better. */
      padding: calc(48px + env(safe-area-inset-top, 0px)) 0 12px;
      position: relative;
    }

    /* marquee bulb strip — the illuminated sign at the top of a real cabinet */
    header::before {
      content: '';
      position: absolute;
      top: 22px;
      left: 10%;
      right: 10%;
      height: 6px;
      background-image: radial-gradient(circle, var(--yellow) 0 2.2px, transparent 2.6px);
      background-size: 26px 6px;
      background-repeat: repeat-x;
      background-position: center;
      filter: drop-shadow(0 0 5px var(--yellow));
      animation: marquee-bulbs 1.6s steps(2, jump-none) infinite;
    }
    @keyframes marquee-bulbs {
      50% { filter: drop-shadow(0 0 2px var(--yellow)); opacity: .5; }
    }
    @media (max-width: 520px) {
      header::before { left: 4%; right: 4%; }
    }

    /* ---- language switcher ---- */
    .lang-switcher {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      align-items: flex-end;
    }

    .lang-btn {
      background: none;
      border: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity .15s, filter .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .lang-btn:hover:not(.active) { opacity: 0.65; }

    .lang-btn.active {
      opacity: 1;
      filter: drop-shadow(0 0 5px var(--green));
    }

    /* Match the badge avatars, which shrink at this width (kiosk.css). */
    @media (max-width: 600px) {
      .lang-btn { width: 32px; height: 32px; font-size: 22px; }
    }

    /* .top-marquee-bar + the logo/coin-slot height match live in kiosk.css
       now, shared identically with about / controls / history. */

    @media (max-width: 480px) {
      /* The kiosk bar grows to ~76px on phones to seat the bigger touch
         controls, so lift the corner badges / language flags clear of it. */
      .left-badges, .lang-switcher { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    }


    .divider {
      width: 100%;
      max-width: 900px;
      height: 1px;
      background: linear-gradient(to right, transparent, #222, transparent);
      margin: 0 auto 24px;
    }

    /* ---- screen bezel — frames the game grid like a monitor set into the
       cabinet, complete with corner screws and a glass glare ---- */
    .screen-bezel {
      position: relative;
      width: 100%;
      max-width: 948px;
      margin: 0 auto 40px;
      padding: 26px 22px 30px;
      border-radius: 18px;
      background: linear-gradient(155deg, #29292d 0%, #17171a 40%, #0b0b0d 100%);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.6),
        0 0 0 6px #050506,
        0 0 0 7px rgba(255,255,255,0.03);
    }
    .screen-bezel::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      box-shadow: inset 0 0 26px rgba(0,0,0,0.85), inset 0 2px 0 rgba(255,255,255,0.04);
      pointer-events: none;
    }
    .screen-bezel::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      background: linear-gradient(115deg,
        rgba(255,255,255,0.05) 0%, transparent 16%,
        transparent 82%, rgba(255,255,255,0.03) 100%);
      pointer-events: none;
    }
    .screen-bezel .screw {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #6c6c70, #101012 72%);
      box-shadow: 0 1px 1px rgba(255,255,255,0.15), 0 1px 2px rgba(0,0,0,0.8);
    }
    .screen-bezel .screw::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 1px;
      background: #000;
      transform: translate(-50%, -50%) rotate(35deg);
    }
    .screen-bezel .screw.tl { top: 9px; left: 9px; }
    .screen-bezel .screw.tr { top: 9px; right: 9px; }
    .screen-bezel .screw.bl { bottom: 9px; left: 9px; }
    .screen-bezel .screw.br { bottom: 9px; right: 9px; }
    @media (max-width: 520px) {
      .screen-bezel { padding: 20px 14px 24px; border-radius: 14px; }
    }

    /* ---- game grid ---- */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    /* ---- card ---- */
    .card {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-decoration: none;
      color: inherit;
      border: 1px solid #1e1e1e;
      padding: 28px 24px 24px;
      background: #0a0a0c;
      position: relative;
      overflow: hidden;
      transition: transform .15s, box-shadow .2s, border-color .2s, opacity .3s, filter .3s;
      cursor: pointer;
    }

    .card:hover, .card-focused { transform: translateY(-3px); }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
    }
    .card::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .card::after  { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    .card-serpent    { --c: var(--green);   }
    .card-bouncer    { --c: var(--cyan);    }
    .card-galactic   { --c: var(--magenta); }
    .card-rally      { --c: var(--red);     }
    .card-meteors    { --c: #b4b4b4;        }
    .card-sky-raider { --c: var(--blue);    }

    /* ---- keyboard-recommended chip ---- */
    .badge-kb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #7a7a7a;
      border: 1px solid #2c2c2c;
      padding: 3px 10px 3px 8px;
      margin-bottom: 14px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.02);
    }

    .card::before, .card::after { border-color: var(--c); }

    .card:hover, .card-focused {
      border-color: var(--c);
      box-shadow:
        0 0 16px rgba(0,0,0,.8),
        0 0 30px color-mix(in srgb, var(--c) 20%, transparent),
        inset 0 0 20px color-mix(in srgb, var(--c) 4%, transparent);
    }

    /* screenshot */
    .card-shot-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 480 / 540;
      margin-bottom: 16px;
      padding: 6px;
      border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--c) 15%, transparent);
      background: #000;
    }

    .card-shot {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
    }

    /* Meteors is anti-aliased vector line art, not pixel-art sprites —
       nearest-neighbor scaling turns its smooth lines into jagged noise
       at thumbnail size, so give it a normal smooth downscale instead. */
    .card-meteors .card-shot {
      image-rendering: auto;
    }

    .card-title {
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: .2em;
      font-weight: 900;
      color: var(--c);
      text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: left;
      width: 100%;
    }

    /* This copy sits inside the screen bezel, describing what's on the
       tube — the same lit-phosphor glow as the rest of the on-screen
       text (card-title), just dimmer since it's body copy, not a
       headline. */
    .card-genre, .card-desc, .card-controls {
      text-shadow: 0 0 5px currentColor;
    }

    .card-genre {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #6e8c30;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: left;
    }

    .card-desc {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.75;
      color: #6e8c30;
      text-align: left;
      letter-spacing: .04em;
      margin-bottom: 24px;
      flex: 1;
    }

    .card-controls {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #6e8c30;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-align: left;
    }

    /* No credits: the whole card reads as dimmed/unlit rather than a
       separate "NEED COIN" label — still fully visible (and still
       clickable, though attemptStart() no-ops when broke), just clearly
       not the inviting, lit-up look a card with credit behind it gets. */
    .card.no-credit {
      opacity: 0.4;
      filter: grayscale(45%);
    }
    /* Pressing a dark card while broke: it drops almost out entirely for a
       beat — a dead, unlit "nothing happens here, put a coin in" thunk —
       then eases back to its resting dim. */
    .card.rejected { animation: card-reject 0.55s ease-out; }
    @keyframes card-reject {
      0%   { opacity: 0.4;  filter: grayscale(45%); }
      22%  { opacity: 0.05; filter: grayscale(90%) brightness(0.35); transform: scale(0.98); }
      100% { opacity: 0.4;  filter: grayscale(45%); }
    }

    @media (max-width: 520px) {
      .card        { padding-left: 40px; }
    }

    /* ---- 2-player seal ---- */
    .badge-2p {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 52px;
      height: 52px;
      border: 2px solid var(--yellow);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--yellow);
      text-shadow: 0 0 6px var(--yellow);
      box-shadow:
        0 0 0 3px rgba(0,0,0,0.85),
        0 0 0 5px color-mix(in srgb, var(--yellow) 35%, transparent),
        0 0 14px color-mix(in srgb, var(--yellow) 35%, transparent);
      transform: rotate(12deg);
      text-align: center;
      line-height: 1.3;
      background: rgba(0,0,0,0.85);
      z-index: 2;
    }

    /* ---- footer ---- */
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: #2a2a2a;
      text-transform: uppercase;
      line-height: 2;
    }

    /* ---- cabinet side rails — the cabinet's side art, only shown once the
       viewport is wide enough that they won't crowd the actual content ---- */
    .cab-rail {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 64px;
      display: none;
      pointer-events: none;
      z-index: 4;
      background:
        radial-gradient(circle at 50% 0, #c8c8ce 0 2.4px, rgba(200,200,206,0.15) 3px, transparent 4px)
          0 44px / 100% 150px repeat-y,
        repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 5px),
        linear-gradient(90deg, #3c3c42, #232326 55%, #131315);
    }
    /* bright seam where the rail meets the screen — sells it as a distinct panel */
    .cab-rail::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18) 15%, rgba(255,255,255,0.18) 85%, transparent);
    }
    .cab-rail.left  { left: 0; box-shadow: inset -14px 0 28px rgba(0,0,0,0.75); }
    .cab-rail.left::after  { right: 0; }
    .cab-rail.right { right: 0; box-shadow: inset 14px 0 28px rgba(0,0,0,0.75); transform: scaleX(-1); }
    .cab-rail.right::after { right: 0; }
    @media (min-width: 1180px) {
      .cab-rail { display: block; }
    }

    /* ---- stars ---- */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 1px;
      height: 1px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d) var(--delay) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: var(--lo); }
      to   { opacity: var(--hi); }
    }

    header, .divider, .game-grid, footer { position: relative; z-index: 1; }

    /* ---- left badge group ---- */
    /* Lower-left corner, centred on the cabinet side rail (.cab-rail.left,
       64px wide with its own rivet dots) rather than pinned to the raw
       viewport edge — reads as mounted on that same panel. The rail only
       renders at 1180px+, but centring on its width holds up fine below
       that too, just without rivets to align with. */
    .left-badges {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      left: 10px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Attract-mode: the corner badges (CONTROLS / ABOUT / HISTORY) and the
       language flags stay hidden until the front page has sat untouched
       for 10s, then fade in — the page's own JS toggles .idle-reveal, any
       interaction takes it away again. */
    .left-badges,
    .lang-switcher {
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s ease;
    }
    .left-badges.idle-reveal,
    .lang-switcher.idle-reveal {
      opacity: 1;
      pointer-events: auto;
    }

    /* ---- about badge ---- */
    /* position:relative + the label pulled out of flow (absolute) so the
       badge's own box is exactly the 44px avatar, regardless of the label
       text's width — otherwise "ABOUT" and "HISTORY" being different
       lengths shifts the two avatars out of alignment under the parent's
       align-items:center (a wider invisible label pushes its icon off
       centre relative to the other badge's icon). */
    .about-badge {
      position: relative;
      display: block;
      text-decoration: none;
      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color .2s;
    }
    .about-badge:hover { color: #D97757; }
    .about-badge:hover .about-label { opacity: 1; transform: translateY(-50%) translateX(0); }
    .about-badge:hover .about-avatar {
      border-color: #D97757;
      box-shadow: 0 0 12px rgba(217,119,87,0.45);
      filter: none;
    }
    .about-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #222;
      display: block;
      transition: border-color .2s, box-shadow .2s, filter .2s;
      filter: grayscale(40%) brightness(0.8);
    }
    .about-label {
      position: absolute;
      left: 54px;
      top: 50%;
      opacity: 0;
      transform: translateY(-50%) translateX(-6px);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
      text-shadow: 0 0 8px #D97757;
      color: #D97757;
    }

    /* ---- history badge ---- */
    .history-badge {
      position: relative;
      display: block;
      text-decoration: none;
      color: #888;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color .2s;
    }
    .history-badge:hover { color: var(--yellow); }
    .history-badge:hover .history-label {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      text-shadow: 0 0 8px var(--yellow);
      color: var(--yellow);
    }
    .history-badge:hover .history-avatar {
      border-color: var(--yellow);
      box-shadow: 0 0 12px rgba(230,220,50,0.45);
      filter: none;
    }
    .history-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #222;
      display: block;
      transition: border-color .2s, box-shadow .2s, filter .2s;
      filter: grayscale(20%) brightness(0.7);
    }
    .history-label {
      position: absolute;
      left: 54px;
      top: 50%;
      opacity: 0;
      transform: translateY(-50%) translateX(-6px);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
      text-shadow: 0 0 8px var(--yellow);
      color: var(--yellow);
    }

    /* ---- controls badge ---- */
    .controls-badge {
      position: relative;
      display: block;
      text-decoration: none;
      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color .2s;
    }
    .controls-badge:hover { color: var(--green); }
    .controls-badge:hover .controls-label {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    .controls-badge:hover .controls-avatar {
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(50,200,50,0.45);
      filter: none;
    }
    .controls-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #222;
      display: block;
      transition: border-color .2s, box-shadow .2s, filter .2s;
      filter: grayscale(35%) brightness(0.8);
    }
    .controls-label {
      position: absolute;
      left: 54px;
      top: 50%;
      opacity: 0;
      transform: translateY(-50%) translateX(-6px);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
      text-shadow: 0 0 8px var(--green);
      color: var(--green);
    }

    /* Solid backing so the revealed label stays legible over the game grid
       text it floats across. */
    .controls-label, .about-label, .history-label {
      padding: 4px 9px;
      border-radius: 3px;
      background: rgba(5, 5, 8, 0.92);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 4px 14px rgba(0,0,0,0.6);
    }

    /* ---- mastodon badge ---- */
    .profile-badge {
      position: fixed;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      left: 20px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color .2s;
    }

    .profile-badge:hover { color: var(--green); }

    .profile-badge:hover .profile-handle { opacity: 1; transform: translateX(0); }

    .profile-handle {
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
      text-shadow: 0 0 8px var(--green);
      color: var(--green);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #222;
      display: block;
      transition: border-color .2s, box-shadow .2s;
      image-rendering: auto;
      filter: grayscale(40%) brightness(0.8);
    }

    .profile-badge:hover .avatar {
      border-color: var(--green);
      box-shadow: 0 0 12px color-mix(in srgb, var(--green) 50%, transparent);
      filter: none;
    }

    @keyframes konami-shake {
      0%,100% { transform: translate(0,0); }
      10%     { transform: translate(-10px,-6px); }
      20%     { transform: translate(10px,6px); }
      30%     { transform: translate(-8px,4px); }
      40%     { transform: translate(8px,-4px); }
      50%     { transform: translate(-6px,6px); }
      60%     { transform: translate(6px,-6px); }
      70%     { transform: translate(-4px,3px); }
      80%     { transform: translate(4px,-3px); }
      90%     { transform: translate(-2px,2px); }
    }
    body.konami-shake { animation: konami-shake 0.55s ease; }

  </style>
</head>
<body>

  <a class="blip-logo" href="index.html">BLIP<span class="ba-rest">&nbsp;ARCADE</span></a>
  <div class="top-marquee-bar"></div>

    /* ------------------------------------------------------------------ */
    /* Language application                                                 */
    /* ------------------------------------------------------------------ */
    function applyLang(lang) {
      var t = i18n[lang];
      if (!t) return;

      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.innerHTML = t[key];
      });

      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });

      document.documentElement.lang = lang;
      try { localStorage.setItem('blip-lang', lang); } catch(e) {}
    }

    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentLang = this.getAttribute('data-lang');
        applyLang(currentLang);
      });
    });

    /* load saved language, fall back to browser preference, then English */
    var currentLang = 'en';
    (function() {
      var saved = null;
      try { saved = localStorage.getItem('blip-lang'); } catch(e) {}
      var browserLang = (navigator.language || '').slice(0, 2).toLowerCase();
      currentLang = saved || (i18n[browserLang] ? browserLang : 'en');
      applyLang(currentLang);
    })();

    /* ------------------------------------------------------------------ */
    /* Coin / credits                                                       */
    /* ------------------------------------------------------------------ */
    // ---- Ambient Atari hum ----
    // Only present once there's actually a credit in the machine — silent
    // while broke, same as a real cabinet's transformer hum meaning
    // nothing's really "on" until it's fed. Needs a user gesture to start
    // (autoplay policy), so it arms on the first interaction but only
    // actually starts once coins > 0; the coin-insert click itself counts,
    // so tryStartHum() is also called directly from onCoinInserted below
    // rather than waiting for a second, separate interaction.
    var tryStartHum = (function () {
      var started = false;
      function startHum() {
        started = true;
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.removeEventListener(ev, tryStartHumImpl);
        });
        var ctx = getKioskAudio();

        // Power-supply drone: 58 Hz sawtooth → lowpass → barely audible
        var osc = ctx.createOscillator();
        var lpf = ctx.createBiquadFilter();
        var gMaster = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 58;
        lpf.type = 'lowpass';
        lpf.frequency.value = 320;
        lpf.Q.value = 1.5;
        gMaster.gain.value = 0;
        osc.connect(lpf); lpf.connect(gMaster); gMaster.connect(ctx.destination);
        osc.start();
        gMaster.gain.linearRampToValueAtTime(0.014, ctx.currentTime + 5);

        scheduleGlitch(ctx);
      }

      function scheduleGlitch(ctx) {
        setTimeout(function () {
          playAtariGlitch(ctx);
          scheduleGlitch(ctx);
        }, 12000 + Math.random() * 22000);
      }

      function playAtariGlitch(ctx) {
        var t   = ctx.currentTime;
        var dur = 0.03 + Math.random() * 0.09;
        var len = Math.ceil(ctx.sampleRate * dur);
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d   = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = ctx.createBufferSource();
        var bpf = ctx.createBiquadFilter();
        var g   = ctx.createGain();
        src.buffer = buf;
        bpf.type = 'bandpass';
        bpf.frequency.value = 150 + Math.random() * 500;
        bpf.Q.value = 1;
        src.connect(bpf); bpf.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.025 + Math.random() * 0.02, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.start(t); src.stop(t + dur + 0.01);
      }

      function tryStartHumImpl() {
        if (started || getCoins() <= 0) return;
        startHum();
      }

      ['click', 'touchstart', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, tryStartHumImpl, { passive: true });
      });

      return tryStartHumImpl;
    }());

    // ---- Startup chime ----
    // Plays once, the moment the machine is first fed a coin (0 → 1) — a
    // relay thunk and a rising CRT-flyback whine settling into the ambient
    // hum's own 58 Hz, like the cabinet is genuinely powering up. The game
    // cards only light up once this finishes (see onCoinInserted below),
    // not the instant the coin lands, so there's a beat of "booting up"
    // between paying and playing rather than an instant unlock.
    function playStartupSound(onDone) {
      var ctx = getKioskAudio();
      var t = ctx.currentTime;

      var noiseBuf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * 0.14), ctx.sampleRate);
      var noiseData = noiseBuf.getChannelData(0);
      for (var i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
      var noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      var noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'lowpass';
      noiseFilter.frequency.setValueAtTime(2200, t);
      noiseFilter.frequency.exponentialRampToValueAtTime(80, t + 0.14);
      var noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.5, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
      noise.start(t); noise.stop(t + 0.16);

      var osc  = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(60, t + 0.06);
      osc.frequency.exponentialRampToValueAtTime(920, t + 0.4);
      osc.frequency.exponentialRampToValueAtTime(58, t + 0.9);
      gain.gain.setValueAtTime(0.0001, t + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.2, t + 0.32);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t + 0.06); osc.stop(t + 0.96);

      if (typeof onDone === 'function') setTimeout(onDone, 900);
    }

    window.onCoinInserted = function() {
      if (getCoins() === 1) {
        // This coin just brought the machine from empty to funded — power
        // up first, light up the cards once that finishes.
        playStartupSound(function () {
          updateCardDimming();
        });
        tryStartHum();
      } else {
        updateCardDimming();
      }
    };

    // No credits: every card dims (still fully visible, just clearly
    // unlit) instead of a separate "NEED COIN" label — same gate as the
    // card click itself, just shown on the cards directly.
    function updateCardDimming() {
      var enabled = getCoins() > 0;
      document.querySelectorAll('.card').forEach(function(card) {
        card.classList.toggle('no-credit', !enabled);
      });
    }

    function updateCreditsDisplay() {
      updateCoinsHud();
      updateCardDimming();
      if (typeof updateCoinBeckon === 'function') updateCoinBeckon();
    }

    updateCreditsDisplay(); // initialise dimming to match coins on page load

    // Spends one credit and launches `card`'s game — the click handler for
    // the whole card, now that there's no separate start button. A no-op
    // (not a shake/sound) when broke: same as pushing an unlit physical
    // start button.
    function attemptStart(card) {
      var n = getCoins();
      if (n <= 0) {
        nudgeInsertCoin();
        card.classList.remove('rejected');
        void card.offsetWidth;
        card.classList.add('rejected');
        card.addEventListener('animationend', function () {
          card.classList.remove('rejected');
        }, { once: true });
        return;
      }
      saveCoins(n - 1);
      updateCoinsHud();
      if (window.clearBadgePin) window.clearBadgePin();
      window.location.href = card.href;
    }

    // Points a broke player at the COINS button in the top-right corner
    // instead of leaving the dimmed-card press feeling dead: a quick swell
    // + flicker on the button (see .coin-nudge).
    function nudgeInsertCoin() {
      ['kiosk-insert-btn'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('coin-nudge');
        void el.offsetWidth;
        el.classList.add('coin-nudge');
        el.addEventListener('animationend', function () {
          el.classList.remove('coin-nudge');
        }, { once: true });
      });
    }

    document.querySelectorAll('.card').forEach(function(card) {
      card.addEventListener('click', function(e) {
        e.preventDefault();
        attemptStart(card);
      });
    });

    document.getElementById('kiosk-insert-btn').addEventListener('click', insertCoin);

    // ---- Card navigation: keyboard arrows + joystick/gamepad ----
    (function () {
      var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
      if (!cards.length) return;
      var idx = 0;
      var navActive = false;

      function highlight() {
        cards.forEach(function (c, i) {
          c.classList.toggle('card-focused', navActive && i === idx);
        });
      }

      function move(delta) {
        navActive = true;
        idx = (idx + delta + cards.length) % cards.length;
        highlight();
        cards[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }

      function activate() {
        // Fire always starts the selected game — default to the first card
        // if the player hasn't moved the selection yet, and auto-insert a
        // coin if needed rather than silently doing nothing.
        if (!navActive) { navActive = true; highlight(); }
        if (getCoins() <= 0) insertCoin();
        cards[idx].click();
      }

      document.addEventListener('keydown', function (e) {
        switch (e.code) {
          case 'ArrowRight': case 'ArrowDown': move(1);  e.preventDefault(); break;
          case 'ArrowLeft':  case 'ArrowUp':   move(-1); e.preventDefault(); break;
          case 'Space': case 'Enter':          activate(); e.preventDefault(); break;
        }
      });

      pollGamepad(
        function (code) {
          if (code === 'ArrowRight' || code === 'ArrowDown') move(1);
          else if (code === 'ArrowLeft' || code === 'ArrowUp') move(-1);
          else if (code === 'Space') activate();
        },
        function () {}
      );
    }());

    document.addEventListener('keydown', function(e) {
      if (e.key === '5' || e.key === 'c' || e.key === 'C') insertCoin();
      konamiCheck(e.key);
    });

    /* Attract-mode reveal for the corner badges + language flags:
       - hidden by default; fade in after 10s untouched, hide again on any
         deliberate interaction.
       - once one of them has actually been used (a badge or a flag
         clicked), they PIN visible for 3 minutes — surviving the trip out
         to about/history/controls and back (sessionStorage) — so you can
         move between the info pages without the 10s wait each time.
       - starting a game clears the pin (see attemptStart). */
    window.clearBadgePin = function () {
      try { sessionStorage.removeItem('blip-badge-pin'); } catch (e) {}
    };
    (function () {
      var badges = document.querySelector('.left-badges');
      var flags  = document.querySelector('.lang-switcher');
      if (!badges && !flags) return;
      var IDLE_MS = 10000, PIN_MS = 180000, KEY = 'blip-badge-pin';
      var idleTimer = null, pinTimer = null;

      function pinnedUntil() {
        try { return +sessionStorage.getItem(KEY) || 0; } catch (e) { return 0; }
      }
      function isPinned() { return Date.now() < pinnedUntil(); }
      function toggle(on) {
        if (badges) badges.classList.toggle('idle-reveal', on);
        if (flags)  flags.classList.toggle('idle-reveal', on);
      }
      function armIdle() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () { toggle(true); }, IDLE_MS);
      }
      function armPinRevert() {
        clearTimeout(pinTimer);
        var ms = pinnedUntil() - Date.now();
        if (ms > 0) pinTimer = setTimeout(function () { toggle(false); armIdle(); }, ms);
      }
      function pin() {
        try { sessionStorage.setItem(KEY, Date.now() + PIN_MS); } catch (e) {}
        clearTimeout(idleTimer);
        toggle(true);
        armPinRevert();
      }
      function poke() {
        if (isPinned()) return;   // pinned — interaction doesn't dismiss
        toggle(false);
        armIdle();
      }

      // Deliberate actions only — a mouse moving toward a revealed badge
      // to click it must not make it vanish first.
      ['pointerdown', 'keydown', 'wheel', 'touchstart', 'touchmove', 'scroll']
        .forEach(function (ev) { window.addEventListener(ev, poke, { passive: true }); });

      // Using a badge or a flag pins the set.
      document.querySelectorAll('.left-badges a, .lang-btn')
        .forEach(function (el) { el.addEventListener('click', pin); });

      if (isPinned()) { toggle(true); armPinRevert(); }
      else { toggle(false); armIdle(); }
    }());


    var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
    var konamiIdx = 0;
    function konamiCheck(key) {
      konamiIdx = (key === KONAMI[konamiIdx]) ? konamiIdx + 1 : (key === KONAMI[0] ? 1 : 0);
      if (konamiIdx === KONAMI.length) {
        konamiIdx = 0;
        konamiActivate();
      }
    }
    function konamiActivate() {
      var n = getCoins();
      var added = Math.min(5, MAX_COINS - n);
      saveCoins(Math.min(n + 5, MAX_COINS));
      updateCoinsHud();
      for (var i = 0; i < added; i++) {
        setTimeout(playCoinInsert, i * 90);
      }
      document.body.classList.remove('konami-shake');
      void document.body.offsetWidth;
      document.body.classList.add('konami-shake');
      document.body.addEventListener('animationend', function() {
        document.body.classList.remove('konami-shake');
      }, { once: true });
    }

    /* ------------------------------------------------------------------ */
    /* Starfield                                                            */
    /* ------------------------------------------------------------------ */
    var stars = document.getElementById('stars');
    for (var i = 0; i < 120; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = [
        'left:'    + (Math.random() * 100) + '%',
        'top:'     + (Math.random() * 100) + '%',
        '--d:'     + (2 + Math.random() * 4).toFixed(1) + 's',
        '--delay:' + (Math.random() * 4).toFixed(1) + 's',
        '--lo:'    + (0.05 + Math.random() * 0.1).toFixed(2),
        '--hi:'    + (0.3  + Math.random() * 0.5).toFixed(2),
      ].join(';');
      stars.appendChild(s);
    }
  </script>
