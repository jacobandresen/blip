  <style>
    html { background:#100d0b; }
    :root[data-cabinet-arranging] body { opacity:0; pointer-events:none; }
    /* Back from a machine, its parts move back into the aisle: the room is shown as it is laid out. */
    :root[data-cabinet-arranging][data-machine-return] body { opacity:1; }
  </style>
  <script>
    // Every visit starts in the arcade, whatever was open last; the Home
    // Screen and BLIP are a switch away. A game's BLIP badge comes back here.
    try { localStorage.setItem('blip-frontend', 'cabinet'); } catch (e) {}
    try { sessionStorage.setItem('blip-freeplay', '0'); } catch (e) {}   // this session plays the cabinet's way
    document.documentElement.setAttribute('data-cabinet-arranging', '');
  </script>
  <!-- The first frame waits for the whole page to be parsed: a machine coming back from its game is named by the
       page's script before that frame is shown and captured. -->
  <link rel="expect" href="#arcade-parsed" blocking="render">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
  <link rel="stylesheet" href="blip.css?v=194">
  <link rel="stylesheet" href="arcade.css?v=18">
  <!-- Match the shared cabinet controls before first paint. -->
  <script>
    if (('ontouchstart' in window) || navigator.maxTouchPoints > 0)
      document.documentElement.setAttribute('data-has-touch', '');

    try {
      var departure = JSON.parse(sessionStorage.getItem('blip-cabinet-return') || 'null');
      sessionStorage.removeItem('blip-cabinet-return');
      if (departure && Date.now() - departure.at < 15000 && /^[a-z_]+$/.test(departure.slug)) {
        // A browser that carries the machine across pages steps back from it (blipMachineReturn); otherwise the
        // aisle rolls back in over the game's last frame.
        if (departure.native && 'onpagereveal' in window) {
          window.blipMachineReturn = departure;
          document.documentElement.setAttribute('data-machine-return', '');
        }
        else {
          window.blipCabinetReturn = departure;
          document.documentElement.setAttribute('data-cabinet-return', '');
        }
      }
    } catch (e) {}

    try {
      if (localStorage.getItem('blip-fullscreen') === '1')
        document.documentElement.setAttribute('data-fullscreen', '');
    } catch (e) {}
  </script>

  <template id="manual-first-use">
    <div class="manual-leaf">
    <div class="page">
    <p class="manual-first-edition">BLIP ARCADE &nbsp; · &nbsp; MANUAL</p>
    <h2>First time use</h2>
    <p class="manual-first-intro">A few coins. A steady hand. You are ready to play.</p>
    <div class="manual-first-steps">
    <section class="manual-first-step">
    <h3>1. Insert a coin</h3>
    <p>Press the coin door on a machine, press <kbd>5</kbd> on the keyboard, or press Select on a gamepad. The door shows your credits, and the Start lamp lights when you can play.</p>
    </section>
    <section class="manual-first-step">
    <h3>2. Choose your game</h3>
    <p>Use the left and right arrow keys, a gamepad, or the on-screen arrows to walk between machines.</p>
    </section>
    <section class="manual-first-step">
    <h3>3. Load and play</h3>
    <p>Press Start on the machine. Its screen opens and play begins. Use the controls shown beneath the screen.</p>
    </section>
    </div>
    <p>For a game’s own keys and playing notes, find it in the contents. To choose another game, press the BLIP logo, the game’s title or the docked ROM.</p>
    </div>
