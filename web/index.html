    :root[data-cabinet-arranging][data-machine-return] body { opacity:1; }
  </style>
  <script>
    // Every visit starts in the arcade, whatever was open last; the Home
    // Screen and BLIP are a switch away. A game's BLIP badge comes back here.
    try { localStorage.setItem('blip-frontend', 'cabinet'); } catch (e) {}
    try { sessionStorage.setItem('blip-freeplay', '0'); } catch (e) {}   // this session plays the cabinet's way
    document.documentElement.setAttribute('data-cabinet-arranging', '');
  </script>
  <!-- The first frame waits for the whole page to be parsed: a machine coming back from its game is named by the
       page's script before that frame is shown and captured. -->
  <link rel="expect" href="#arcade-parsed" blocking="render">

  <!-- Match the shared cabinet controls before first paint. -->
  <script>
    if (('ontouchstart' in window) || navigator.maxTouchPoints > 0)
      document.documentElement.setAttribute('data-has-touch', '');

    try {
      var departure = JSON.parse(sessionStorage.getItem('blip-cabinet-return') || 'null');
      sessionStorage.removeItem('blip-cabinet-return');
      if (departure && Date.now() - departure.at < 15000 && /^[a-z_]+$/.test(departure.slug)) {
        // A browser that carries the machine across pages steps back from it (blipMachineReturn); otherwise the
        // aisle rolls back in over the game's last frame.
        if (departure.native && 'onpagereveal' in window) {
          window.blipMachineReturn = departure;
          document.documentElement.setAttribute('data-machine-return', '');
        }
        else {
          window.blipCabinetReturn = departure;
          document.documentElement.setAttribute('data-cabinet-return', '');
        }
      }
    } catch (e) {}

    // Resolve the room before paint: explicit mode wins, otherwise use lite on a small supported device.
    var roomMode = 'full';
    var roomAsked = null;
    try { roomAsked = new URLSearchParams(location.search).get('room'); } catch (e) {}
    if (roomAsked === 'full' || roomAsked === 'lite') roomMode = roomAsked;
    else if (['hardwareConcurrency','deviceMemory'].some(function (name) {
      try { var value = navigator[name]; return typeof value === 'number' && isFinite(value) && value > 0 && value <= 2; }
      catch (e) { return false; }
    })) roomMode = 'lite';
    document.documentElement.setAttribute('data-room', roomMode);

    try {
      if (localStorage.getItem('blip-fullscreen') === '1')
        document.documentElement.setAttribute('data-fullscreen', '');
    } catch (e) {}
  </script>
