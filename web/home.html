<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <meta name="theme-color" content="#120f24">
  <title>BLIP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <script src="blip_core.js?v=1"></script>
  <link rel="stylesheet" href="home.css?v=1">
</head>
<body class="home-page">
  <header class="status-bar">
    <time id="home-clock" class="status-time">9:41</time>
    <span class="status-right">
      <span class="status-pill">FREE PLAY</span>
      <svg class="status-battery" viewBox="0 0 26 12" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3"/><rect class="charge" x="2.5" y="2.5" width="18" height="7" rx="1.5"/><rect x="23.5" y="4" width="2" height="4" rx="1"/></svg>
    </span>
  </header>

  <main class="springboard">
    <ul class="app-grid" id="app-grid" aria-label="Games"></ul>
  </main>

  <nav class="dock" aria-label="Dock">
    <ul class="dock-row" id="dock-row"></ul>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

  <section class="action-sheet" id="action-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="action-title">
    <div class="action-group">
      <div class="action-head"><img id="action-icon" alt=""><span id="action-title"></span></div>
      <button type="button" data-action="play">Play</button>
      <button type="button" data-action="install">Add to Home Screen</button>
    </div>
    <button type="button" class="action-cancel" data-action="cancel">Cancel</button>
  </section>

  <section class="settings-sheet" id="settings-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <ul class="settings-list">
      <li><label for="set-sound">Sound</label><input type="checkbox" role="switch" id="set-sound"></li>
      <li><label for="set-fullscreen">Fullscreen</label><input type="checkbox" role="switch" id="set-fullscreen"></li>
      <li><label for="set-cabinet">Start in the arcade cabinet</label><input type="checkbox" role="switch" id="set-cabinet"></li>
    </ul>
    <button type="button" class="settings-done" id="settings-done">Done</button>
  </section>

  <div class="launch-zoom" id="launch-zoom" hidden></div>

  <script src="home.js?v=1"></script>
</body>
</html>
