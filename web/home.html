<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <meta name="theme-color" content="#120f24">
  <title>BLIP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <script src="blip_core.js?v=2"></script>
  <link rel="stylesheet" href="home.css?v=2">
</head>
<body class="home-page">
  <header class="status-bar">
    <time id="home-clock" class="status-time">9:41</time>
    <span class="status-right" aria-hidden="true">
      <svg class="status-signal" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
      <svg class="status-wifi" viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.8 10.8 0 0 0 8 .4 10.8 10.8 0 0 0 .5 3.4l1.2 1.3A9 9 0 0 1 8 2.2zm0 3.5c1.4 0 2.7.5 3.8 1.4L13 5.8a7.5 7.5 0 0 0-10 0l1.2 1.3c1-.9 2.4-1.4 3.8-1.4zm0 3.4c.6 0 1.1.2 1.5.5L8 11.6 6.5 9.6c.4-.3.9-.5 1.5-.5z"/></svg>
      <svg class="status-battery" viewBox="0 0 27 13"><rect class="shell" x=".5" y=".5" width="23" height="12" rx="3.6"/><rect class="charge" x="2.5" y="2.5" width="19" height="8" rx="2"/><path class="nub" d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z"/></svg>
    </span>
  </header>

  <main class="springboard">
    <ul class="app-grid" id="app-grid" aria-label="Games"></ul>
  </main>

  <button type="button" class="search-pill" id="search-pill"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m10.6 10.6 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Search</button>

  <nav class="dock" aria-label="Dock">
    <ul class="dock-row" id="dock-row"></ul>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

  <section class="action-sheet" id="action-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="action-title">
    <div class="action-group">
      <div class="action-head"><img id="action-icon" alt=""><span id="action-title"></span></div>
      <button type="button" data-action="play">Play</button>
      <button type="button" data-action="install">Add to Home Screen</button>
    </div>
    <button type="button" class="action-cancel" data-action="cancel">Cancel</button>
  </section>

  <section class="settings-sheet" id="settings-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <ul class="settings-list">
      <li><label for="set-sound">Sound</label><input type="checkbox" role="switch" id="set-sound"></li>
      <li><label for="set-fullscreen">Fullscreen</label><input type="checkbox" role="switch" id="set-fullscreen"></li>
      <li><label for="set-cabinet">Start in the arcade cabinet</label><input type="checkbox" role="switch" id="set-cabinet"></li>
    </ul>
    <button type="button" class="settings-done" id="settings-done">Done</button>
  </section>

  <section class="search-sheet" id="search-sheet" hidden role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-field">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m10.6 10.6 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="search" id="search-input" placeholder="Search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Search games">
      <button type="button" class="search-cancel" id="search-cancel">Cancel</button>
    </div>
    <p class="search-heading">Games</p>
    <ul class="search-results" id="search-results"></ul>
  </section>

  <div class="launch-zoom" id="launch-zoom" hidden><img alt=""></div>

  <script src="home.js?v=2"></script>
</body>
</html>
