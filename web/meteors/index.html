<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script src="../howler.min.js"></script>
  <script src="../kiosk.js?v=14"></script>
  <link rel="stylesheet" href="../kiosk.css?v=30">
  <link rel="stylesheet" href="../shell.css?v=23">
</head>
<body>

  <a class="blip-logo" href="../index.html">BLIP<span class="ba-rest">&nbsp;ARCADE</span></a>

  <!-- Coin slot: fixed in the top-right corner of the cabinet's top panel,
       mirroring the BLIP ARCADE logo at top-left — the physical slot you
       feed, up on the panel, not down on the control deck. -->
  <button id="insert-coin-btn" class="kiosk-btn"><span data-coins-hud></span></button>

  <div id="loader">
    <div id="status">LOADING</div>
    <div id="bar-outer"><div id="bar-inner"></div></div>
  </div>

  <!-- The fixed bar is a plain (untransformed) box; .deck-panel is the
       3D-tilted control surface inside it. Keeping the tilt off the
       position:fixed element is what stops iOS Safari clipping the bar's
       lower edge / floating it off the bottom in a home-screen PWA. -->
  <div id="topbar" class="kiosk-bar">
   <div class="deck-panel">
    <!-- Arcade stick: mounted flush in the bar, left edge — its ball
         rides a shaft that rises up over the game above the bar. Always
         shown, not just on touch devices — draggable by touch/mouse
         (shell.js), and it animates to reflect keyboard and gamepad
         input too, so it doubles as a live input readout. -->
    <div id="stick-base">
      <div id="stick-boot"></div>
      <div id="stick-handle">
        <div id="stick-shaft"></div>
        <div id="stick-ball"></div>
      </div>
    </div>
    <!-- Fire buttons: mounted just right of the stick (with a gap between
         them, see kiosk.css). Populated by shell.js from BLIP_GAMES (one
         or two buttons). -->
    <div id="fire-buttons"></div>
   </div>
  </div>

  <div id="need-coin-overlay">
    <div class="nco-panel">
      <div class="nco-msg">INSERT COIN</div>
      <div class="nco-sub">1 Coin  1 Play</div>
      <div class="nco-credit">Credit&#160;&#160;0</div>
    </div>
  </div>

  <!-- Paddle dials: rally only, touch only. P1=left, P2=right -->
  <div id="paddle-dial">
    <div id="dial-hand"></div>
    <div id="dial-label">P1</div>
  </div>
  <div id="paddle-dial-p2">
    <div id="dial-hand-p2"></div>
    <div id="dial-label-p2">2P</div>
  </div>

  <!-- #marquee-bar (per-game backlit name sign) is injected by shell.js -->
  <div id="arcade-bezel"></div>
  <span class="bezel-screw tl"></span>
  <span class="bezel-screw tr"></span>
  <span class="bezel-screw bl"></span>
  <span class="bezel-screw br"></span>
  <canvas id="glcanvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

  <script src="../shell.js?v=30"></script>
  <script src="../mq_js_bundle.js?v=1"></script>
  <script src="../howler_audio_plugin.js"></script>
  <script src="../blip_bridge.js?v=7"></script>
  <script>load("index.wasm");</script>

</body>
</html>
