  <!-- deck.js mounts the shared coin mechanism beside the controls. -->
  <button id="insert-coin-btn" class="kiosk-btn"></button>



  <div id="loader">
    <div id="status">LOADING</div>
    <div id="bar-outer"><div id="bar-inner"></div></div>
  </div>

  <!-- The fixed bar has no transform (iOS Safari clips a transformed fixed
       box); .deck-panel inside it carries the tilt. -->
  <div id="topbar" class="kiosk-bar">
   <div class="deck-panel">
    <!-- Paddle dials: rally only. Mounted in the deck like the stick —
         two spinner knobs on the tilted panel, P1 left / P2 right.
         shell.js reveals them and wires the touch spin. -->
    <div id="paddle-dial">
      <div class="dial-cap"><div id="dial-hand"></div></div>
      <div id="dial-label">P1</div>
    </div>
    <div id="paddle-dial-p2">
      <div class="dial-cap"><div id="dial-hand-p2"></div></div>
      <div id="dial-label-p2">2P</div>
    </div>
   </div>

  </div>
  <script src="../deck.js?v=13"></script>

  <!-- Subtle: pick the controller (pad, stick, touch strip). shell.js fills it. -->
  <div id="control-toggle" role="radiogroup" aria-label="On-screen controller"></div>

  <div id="need-coin-overlay">
    <div class="nco-panel">
      <div class="nco-msg">POWER OFF</div>
      <div class="nco-sub nco-go"><span class="nco-pc">PRESS <kbd>SPACE</kbd> TO INSERT A COIN</span><span class="nco-touch">TAP THE COIN SLOT TO START</span></div>
      <div class="nco-sub nco-how"><span class="nco-pc">Or click here, or press 5</span><span class="nco-touch">Controls resume when credit is added</span></div>
    </div>
  </div>

  <!-- #marquee-bar (per-game backlit name sign) is injected by shell.js -->
  <div class="cab-rail left"></div>
  <div class="cab-rail right"></div>
  <div id="arcade-bezel" class="screen-bezel">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>
  </div>
