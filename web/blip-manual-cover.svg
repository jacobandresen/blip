<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 140" role="img" aria-labelledby="title">
  <title id="title">BLIP Arcade operator's manual cover</title>
  <!-- A companion to the BASIC book's cover: the same cloth, frame, name plate and stripes, with a navy band and a cabinet. -->
  <defs>
    <linearGradient id="cloth" x2=".2" y2="1"><stop stop-color="#ecd9a6"/><stop offset=".55" stop-color="#dcc38a"/><stop offset="1" stop-color="#c2a66b"/></linearGradient>
    <linearGradient id="band" x2="1"><stop stop-color="#1f3047"/><stop offset=".5" stop-color="#2f4a66"/><stop offset="1" stop-color="#243a52"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#1d3384"/><stop offset="1" stop-color="#0b1850"/></linearGradient>
    <linearGradient id="case" x2="0" y2="1"><stop stop-color="#3e3d4a"/><stop offset="1" stop-color="#22222b"/></linearGradient>
    <radialGradient id="ball" cx=".38" cy=".32" r=".7"><stop stop-color="#ff8c76"/><stop offset=".5" stop-color="#d9302a"/><stop offset="1" stop-color="#7a0d07"/></radialGradient>
  </defs>
  <rect width="96" height="140" fill="url(#cloth)"/>
  <rect width="13" height="140" fill="url(#band)"/>
  <path d="M13.4 0v140" stroke="#f3dfae" stroke-opacity=".55" stroke-width=".5"/>
  <path d="M15 0v140" stroke="#5d4826" stroke-opacity=".25" stroke-width=".6"/>
  <rect x="20" y="8" width="68" height="124" fill="none" stroke="#6a5532" stroke-width=".7"/>
  <rect x="21.6" y="9.6" width="64.8" height="120.8" fill="none" stroke="#fff4d4" stroke-opacity=".5" stroke-width=".4"/>
  <!-- The BLIP name plate (blip-logo.svg), inlined: an image cannot load another file. -->
  <g transform="translate(20 6.2) scale(0.68)">
      <defs>
      <linearGradient id="logo-copper" x2="0" y2="1">
        <stop offset="0" stop-color="#271d66"/><stop offset=".22" stop-color="#40318d"/><stop offset=".34" stop-color="#6f60cc"/>
        <stop offset=".38" stop-color="#8e80e0"/><stop offset=".42" stop-color="#6f60cc"/><stop offset=".54" stop-color="#40318d"/>
        <stop offset=".8" stop-color="#40318d"/><stop offset="1" stop-color="#271d66"/>
      </linearGradient>
      <linearGradient id="logo-chrome" x2="0" y2="1">
        <stop offset="0" stop-color="#fff"/><stop offset=".52" stop-color="#eef1ff"/>
        <stop offset=".53" stop-color="#b9c4ff"/><stop offset="1" stop-color="#f3f5ff"/>
      </linearGradient>
      <pattern id="logo-scanlines" width="1" height="1.2" patternUnits="userSpaceOnUse"><rect width="1" height=".45" fill="#000" fill-opacity=".06"/></pattern>
      <g id="logo-letters" fill-rule="evenodd">
        <path d="M7 6h10a5 5 0 0 1 0 10H7zM12 9.6v2.8h5a1.4 1.4 0 0 0 0-2.8z"/>
        <path d="M7 15.2h11a5.4 5.4 0 0 1 0 10.8H7zM12 18.8v3.6h5.6a1.8 1.8 0 0 0 0-3.6z"/>
        <path d="M26.6 6h5v16.4h8.4V26H26.6z"/>
        <path d="M41.8 6h5v20h-5z"/>
        <path d="M50 6h10a5.6 5.6 0 0 1 0 11.2h-5V26h-5zM55 9.6v4h4.8a2 2 0 0 0 0-4z"/>
      </g>
    </defs>
    <rect x=".75" y=".75" width="98.5" height="30.5" rx="5.5" fill="url(#logo-copper)" stroke="#7869c4" stroke-width="1.5"/>
    <g transform="skewX(-24)">
      <path d="M81 6h3.8v20H81z" fill="#d2493d"/>
      <path d="M85.6 6h3.8v20h-3.8z" fill="#e48d3a"/>
      <path d="M90.2 6h3.8v20h-3.8z" fill="#ecc54c"/>
      <path d="M94.8 6h3.8v20h-3.8z" fill="#4f9be0"/>
    </g>
    <g transform="translate(3.4 0) skewX(-12)">
      <g fill="none" stroke="#0b0726" stroke-width="1.4" stroke-linejoin="round">
        <use href="#logo-letters" transform="translate(2.2 2.2)"/>
        <use href="#logo-letters"/>
      </g>
      <use href="#logo-letters" transform="translate(2.2 2.2)" fill="#120c3a"/>
      <use href="#logo-letters" transform="translate(1.1 1.1)" fill="#1d1554"/>
      <use href="#logo-letters" fill="url(#logo-chrome)"/>
    </g>
    <rect x="1.5" y="1.5" width="97" height="29" rx="4.8" fill="url(#logo-scanlines)"/>
  </g>
  <text x="24.6" y="41" fill="#24364a" font-family="Arial Black,Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="-.1">MANUAL</text>
  <text x="25" y="46.6" fill="#8a3a2d" font-family="Arial,sans-serif" font-size="2.7" font-weight="700" textLength="56" lengthAdjust="spacingAndGlyphs">THE BLIP ARCADE · OPERATOR'S COPY</text>
  <text x="83" y="52.6" fill="#5f5139" fill-opacity=".7" font-family="Snell Roundhand,Apple Chancery,Segoe Script,Z003,URW Chancery L,Brush Script MT,cursive" font-size="3.6" font-style="italic" text-anchor="end">Jacob Andresen</text>
  <path d="M25 56h58" stroke="#8b7650" stroke-width=".4"/>
  <!-- The cabinet: marquee, screen, a two-player panel of ball-tops and caps, and the coin door. -->
  <g>
    <path d="M40 60h28l1 4v42h-30V64z" fill="url(#case)" stroke="#16151b" stroke-width=".5"/>
    <rect x="40.6" y="60.6" width="26.8" height="5" rx=".8" fill="#d2493d"/>
    <text x="54" y="64.4" fill="#fff4dc" font-family="Arial Black,Arial,sans-serif" font-size="3.4" font-weight="900" text-anchor="middle" letter-spacing=".2">BLIP</text>
    <rect x="42.4" y="67.6" width="23.2" height="17.4" rx="1.4" fill="url(#screen)"/>
    <text x="54" y="74.6" fill="#f2e6b0" font-family="Courier New,monospace" font-size="2.2" font-weight="700" text-anchor="middle">INSERT</text>
    <text x="54" y="78" fill="#f2e6b0" font-family="Courier New,monospace" font-size="2.2" font-weight="700" text-anchor="middle">COIN</text>
    <path d="M36.6 86.4h34.8l-2 6.2H38.6z" fill="#2c2c36" stroke="#16151b" stroke-width=".5"/>
    <circle cx="44" cy="87.4" r="1.6" fill="url(#ball)"/><path d="M44 88.6v1.6" stroke="#111" stroke-width=".7"/><ellipse cx="44" cy="90.4" rx="1.6" ry=".6" fill="#0d0d10"/>
    <circle cx="48.4" cy="89.6" r=".95" fill="#d9302a"/><circle cx="50.8" cy="90.6" r=".95" fill="#2756c8"/>
    <circle cx="58" cy="87.4" r="1.6" fill="url(#ball)"/><path d="M58 88.6v1.6" stroke="#111" stroke-width=".7"/><ellipse cx="58" cy="90.4" rx="1.6" ry=".6" fill="#0d0d10"/>
    <circle cx="62.4" cy="89.6" r=".95" fill="#d9302a"/><circle cx="64.8" cy="90.6" r=".95" fill="#139a7a"/>
    <rect x="49" y="96.6" width="10" height="6.4" rx=".6" fill="#16151b"/>
    <rect x="50.4" y="97.6" width="3" height="3.2" rx=".3" fill="#c0392b"/><rect x="54.6" y="97.6" width="3" height="3.2" rx=".3" fill="#c0392b"/>
    <rect x="38" y="106" width="32" height="1.6" rx=".6" fill="#3a362d"/>
  </g>
  <path d="M20 114h68" stroke="#b5443a" stroke-width="2.2"/>
  <path d="M20 116.6h68" stroke="#d98a3a" stroke-width="2.2"/>
  <path d="M20 119.2h68" stroke="#e3bd4a" stroke-width="2.2"/>
  <path d="M20 121.8h68" stroke="#3f6c8f" stroke-width="2.2"/>
  <text x="25" y="127.8" fill="#5d4d30" font-family="Arial,sans-serif" font-size="2.6" font-weight="700" letter-spacing=".35">NINE GAMES · ONE CABINET</text>
  <text x="83" y="127.8" fill="#5d4d30" font-family="Georgia,serif" font-size="2.8" font-style="italic" text-anchor="end">2026</text>
</svg>
