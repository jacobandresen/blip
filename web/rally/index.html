<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script src="../howler.min.js"></script>
  <script src="../kiosk.js?v=20"></script>
  <link rel="stylesheet" href="../kiosk.css?v=56">
  <link rel="stylesheet" href="../shell.css?v=42">
</head>
<body>

  <a class="blip-logo" href="../index.html">BLIP<span class="ba-rest">&nbsp;ARCADE</span></a>

  <!-- Coin slot: fixed in the top-right corner of the cabinet's top panel,
       mirroring the BLIP ARCADE logo at top-left. -->
  <button id="insert-coin-btn" class="kiosk-btn"><span data-coins-hud></span></button>

  <div id="loader">
    <div id="status">LOADING</div>
    <div id="bar-outer"><div id="bar-inner"></div></div>
  </div>

  <div id="topbar" class="kiosk-bar">
   <div class="deck-panel">
    <!-- Rally always hides #stick-base/#fire-buttons (it uses the paddle
         dials below instead) — kept structurally in sync with shell.html
         regardless. -->
    <div id="stick-base">
      <div id="stick-boot"></div>
      <div id="stick-handle">
        <div id="stick-shaft"></div>
        <div id="stick-ball"></div>
      </div>
    </div>
    <div id="fire-buttons"></div>
    <!-- Paddle dials: mounted in the deck like the stick — two spinner
         knobs on the tilted panel, P1 left / P2 right. -->
    <div id="paddle-dial">
      <div class="dial-cap"><div id="dial-hand"></div></div>
      <div id="dial-label">P1</div>
    </div>
    <div id="paddle-dial-p2">
      <div class="dial-cap"><div id="dial-hand-p2"></div></div>
      <div id="dial-label-p2">2P</div>
    </div>
   </div>

   <!-- Rally hides this (it uses the paddle dials) — kept in sync with
        shell.html regardless, like #stick-base / #fire-buttons. -->
   <div id="snes-pad" aria-hidden="true">
    <span class="snes-cord" aria-hidden="true"></span>
    <div class="snes-shell">
      <div class="snes-dpad">
        <span class="snes-dp-seg dp-up"    data-blip="up"    data-blip-nopress></span>
        <span class="snes-dp-seg dp-right" data-blip="right" data-blip-nopress></span>
        <span class="snes-dp-seg dp-down"  data-blip="down"  data-blip-nopress></span>
        <span class="snes-dp-seg dp-left"  data-blip="left"  data-blip-nopress></span>
        <span class="snes-dp-hub"></span>
      </div>
      <div class="snes-face">
        <button type="button" class="snes-btn snes-b" data-blip="button1" aria-label="Button B"><span></span></button>
        <button type="button" class="snes-btn snes-a" data-blip="button1" aria-label="Button A"><span></span></button>
      </div>
      <span class="snes-wordmark" aria-hidden="true">BLIP</span>
    </div>
   </div>
  </div>

  <button type="button" id="control-toggle" aria-label="Switch on-screen controller">&#9654;&nbsp;<span class="ct-what"></span></button>
  <!-- Two-device play (docs/multiplayer.md) — web/blip_net_ui.js builds
       the pairing modal on demand; see there for HOST / JOIN. -->
  <button type="button" id="net-play-btn">PLAY NEARBY</button>

  <div id="need-coin-overlay">
    <div class="nco-panel">
      <div class="nco-msg">INSERT COIN</div>
      <div class="nco-sub">1 Coin  1 Play</div>
      <div class="nco-credit">Credit&#160;&#160;0</div>
    </div>
  </div>

  <div id="arcade-bezel"></div>
  <canvas id="glcanvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

  <script src="../blip_controller.js?v=4"></script>
  <script src="../shell.js?v=48"></script>
  <!-- Two-device play (docs/multiplayer.md): QR-code pairing only, no
       network/Supabase involved. Both vendored libs load before
       blip_net_ui.js: it checks window.BlipQR at load time and drops the
       whole PLAY NEARBY feature if either failed to load. -->
  <script src="../vendor/qrcode.js?v=1"></script>
  <script src="../vendor/jsQR.js?v=1"></script>
  <script src="../blip_qr.js?v=3"></script>
  <script src="../blip_net_proto.js?v=2"></script>
  <script src="../blip_net.js?v=3"></script>
  <script src="../blip_net_ui.js?v=6"></script>
  <script src="../mq_js_bundle.js?v=1"></script>
  <script src="../howler_audio_plugin.js"></script>
  <script src="../blip_bridge.js?v=11"></script>
  <script>load("index.wasm");</script>

</body>
</html>
