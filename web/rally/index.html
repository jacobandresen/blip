<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLIP">
  <title>BLIP ARCADE</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script src="../howler.min.js"></script>
  <script src="../kiosk.js?v=14"></script>
  <link rel="stylesheet" href="../kiosk.css?v=29">
  <link rel="stylesheet" href="../shell.css?v=21">
</head>
<body>

  <a class="blip-logo" href="../index.html">BLIP<span class="ba-rest">&nbsp;ARCADE</span></a>

  <!-- Coin slot: fixed in the top-right corner of the cabinet's top panel,
       mirroring the BLIP ARCADE logo at top-left. -->
  <button id="insert-coin-btn" class="kiosk-btn"><span data-coins-hud></span></button>

  <div id="loader">
    <div id="status">LOADING</div>
    <div id="bar-outer"><div id="bar-inner"></div></div>
  </div>

  <div id="topbar" class="kiosk-bar">
   <div class="deck-panel">
    <!-- Rally always hides #stick-base/#fire-buttons (it uses the paddle
         dials below instead) — kept structurally in sync with shell.html
         regardless. -->
    <div id="stick-base">
      <div id="stick-boot"></div>
      <div id="stick-handle">
        <div id="stick-shaft"></div>
        <div id="stick-ball"></div>
      </div>
    </div>
    <div id="fire-buttons"></div>
   </div>
  </div>

  <div id="need-coin-overlay">
    <div class="nco-msg">&#x25BA; INSERT COIN &#x25C4;</div>
  </div>

  <!-- Paddle dials: rally only, touch only. P1=left, P2=right -->
  <div id="paddle-dial">
    <div id="dial-hand"></div>
    <div id="dial-label">P1</div>
  </div>
  <div id="paddle-dial-p2">
    <div id="dial-hand-p2"></div>
    <div id="dial-label-p2">2P</div>
  </div>

  <div id="arcade-bezel"></div>
  <canvas id="glcanvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

  <script src="../shell.js?v=30"></script>
  <script src="../mq_js_bundle.js?v=1"></script>
  <script src="../howler_audio_plugin.js"></script>
  <script src="../blip_bridge.js?v=3"></script>
  <script>load("index.wasm");</script>

</body>
</html>
