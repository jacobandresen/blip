<!doctype html>
<html lang="en" class="game-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine deck</title>
  <!-- One game's control deck, built and styled exactly as on its game page; each cabinet in the aisle shows it.
       The coin mechanism is the cabinet's own door, below the deck. -->
  <script>window.BLIP_DECK_GAME = new URLSearchParams(location.search).get('game'); document.documentElement.setAttribute('data-deck-preview','');</script>
  <script src="blip_core.js?v=17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jacobandresen/blip-deck@v1.0.0/blip-deck.css">
  <link rel="stylesheet" href="deck.css?v=12">
  <link rel="stylesheet" href="blip.css?v=177">
</head>
<body class="cabinet-page">
  <div id="topbar" class="kiosk-bar">
   <div class="deck-housing" aria-hidden="true"></div>
   <blip-deck>
    <div id="paddle-dial"><div class="dial-cap"><div id="dial-hand"></div></div><div id="dial-label">P1</div></div>
    <div id="paddle-dial-p2"><div class="dial-cap"><div id="dial-hand-p2"></div></div><div id="dial-label-p2">2P</div></div>
   </blip-deck>
  </div>
  <script>if (window.BLIP_DECK_GAME === 'rally') document.documentElement.setAttribute('data-dials', ''); blipBuildDeck();</script>
  <script src="https://cdn.jsdelivr.net/gh/jacobandresen/blip-deck@v1.0.0/dist/blip-deck.js"></script>
</body>
</html>
