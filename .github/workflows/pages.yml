name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The live database takes the new migrations before the site that needs
  # them goes out. db push applies only those missing from its history.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply new migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set the SUPABASE_DB_URL secret (the database connection string) to deploy."
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all

  deploy:
    needs: migrate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # web/blip_config.js is git-ignored; write it from repo secrets so the
      # Supabase URL + anon key live only in the deployed site, not the repo.
      # Missing secrets → blank config → the leaderboard just stays disabled.
      - name: Inject Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf "window.BLIP_SUPABASE = { url: '%s', anonKey: '%s' };\n" \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > web/blip_config.js
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - uses: actions/deploy-pages@v4
        id: deployment
