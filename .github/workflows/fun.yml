name: Fun estimate

# The games whose code the pull request changes (all of them when shared code changes) are played by their bots on
# the pull request's base and its head with the same seeds, and the fun score
# (tools/fun_report.mjs; crates/blip/src/bot/FUN.md) of every game is compared seed by seed. A game whose score
# drops by more than TOLERANCE points and more than twice the drop's standard error fails the `fun` check.
on:
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'tools/fun_report.mjs', 'test/lib/games.mjs', 'web/blip_core.js', '.github/workflows/fun.yml']

permissions:
  contents: read

concurrency:
  group: fun-${{ github.event.number }}
  cancel-in-progress: true

env:
  TOLERANCE: 5
  SEEDS: 1,2,3,4,5,6
  SECS: 60

jobs:
  # One job, so one check: the changed games are played one after another (passes when none changed).
  fun:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: list
        run: echo "games=$(node tools/fun_report.mjs --changed ${{ github.event.pull_request.base.sha }} | node -p 'JSON.parse(require("fs").readFileSync(0)).join(" ")')" >> "$GITHUB_OUTPUT"
      - name: The base, beside the head
        if: steps.list.outputs.games != ''
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}
      - name: Native build dependencies
        if: steps.list.outputs.games != ''
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        if: steps.list.outputs.games != ''
        with:
          workspaces: |
            . -> target
            ../base -> target
      - name: Measure the base
        if: steps.list.outputs.games != ''
        run: |
          if [ ! -f ../base/crates/blip/src/bot/fun.rs ]; then
            echo "The base has no fun meter yet: nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            echo '{"report":{}}' > base.json
          else
            node tools/fun_report.mjs ${{ steps.list.outputs.games }} --root ../base --seeds "$SEEDS" --secs "$SECS" --json base.json
          fi
      - name: Measure the head and compare
        if: steps.list.outputs.games != ''
        run: node tools/fun_report.mjs ${{ steps.list.outputs.games }} --seeds "$SEEDS" --secs "$SECS" --json head.json --against base.json --tolerance "$TOLERANCE" --near near
      - uses: actions/upload-artifact@v4
        if: always() && steps.list.outputs.games != ''
        with:
          name: fun
          path: |
            base.json
            head.json
            near/
          if-no-files-found: ignore
